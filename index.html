/* V18 goalpost anchor correction */

/* V27 team-branded media cards */
.mediaStory{
  position:relative;
  overflow:hidden;
  min-height:190px;
  padding:15px 15px 14px;
  background:
    radial-gradient(circle at 88% 12%, color-mix(in srgb,var(--story-team,#223044) 32%, transparent), transparent 38%),
    linear-gradient(180deg,#0b1118 0%,#091019 100%);
  border:1px solid color-mix(in srgb,var(--story-team,#304050) 42%, #1d2936);
  box-shadow:inset 4px 0 0 var(--story-team,#304050);
}
.mediaStory:hover{
  background:
    radial-gradient(circle at 88% 12%, color-mix(in srgb,var(--story-team,#223044) 44%, transparent), transparent 42%),
    linear-gradient(180deg,#101923 0%,#0b131d 100%);
  transform:translateY(-2px);
}
.mediaStory::after{
  content:"";
  position:absolute;
  inset:auto -44px -52px auto;
  width:150px;
  height:150px;
  border-radius:50%;

  opacity:.07;
  pointer-events:none;
}
.mediaStoryTop{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:10px;
}

  display:flex;

  gap:10px;

}

  height:42px;

  border-radius:12px;
  display:grid;
  place-items:center;

  border:1px solid rgba(255,255,255,.10);

}

  background:color-mix(in srgb,var(--story-team,#223044) 12%, transparent);
}

function showTeam(slug){let t=TEAM[slug];if(!t)return;location.hash='team='+slug;let tg=GAMES.filter(g=>g.away===slug||g.home===slug).sort((a,b)=>a.date.localeCompare(b.date)),r=RECORDS[slug];let sched=tg.map(g=>{let opp=TEAM[g.away===slug?g.home:g.away],home=g.home===slug,fin=g.status==='final',own=home?g.homeScore:g.awayScore,other=home?g.awayScore:g.homeScore;return `<div class="sched" ${fin?`onclick="showGame('${g.id}')" style="cursor:pointer"`:''}><div class="schedDate"><b>${new Date(g.date+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'})}</b><span>${g.time}</span></div><div><div class="opp">${home?'vs':'at'} ${esc(opp.name)}</div><small>${fin?'Final • open box score':esc(g.venue||'')}</small></div><div class="result">${fin?`${own}–${other}`:'UPCOMING'}</div></div>`}).join('');document.getElementById("app").innerHTML=shell(`<button class="back" onclick="goHome()">← National schedule</button><section class="teamHero" style="--team:${t.primary};--team2:${t.secondary}"><div style="display:flex;gap:20px;align-items:end;position:relative;z-index:2">${logo(t,true)}<div><div class="kicker">${cl(t.conference)} • ${esc(t.city)}</div><h1>${esc(t.name)}</h1><p>${r.w}-${r.l} • ${r.pf} PF • ${r.pa} PA</p></div></div></section><div class="tabs">${['Overview','Schedule','Results','Roster','Stats','News','Media','Players'].map(x=>`<span class="tab">${x}</span>`).join('')}</div><div class="twoCol"><main class="panel"><h2>2026 Schedule & Results</h2><div class="scheduleList">${sched}</div></main><aside class="panel"><h2>Team Snapshot</h2><div class="teamStatGrid"><div class="statTile"><strong>${r.w}-${r.l}</strong><small>Record</small></div><div class="statTile"><strong>${r.pf}</strong><small>Points For</small></div><div class="statTile"><strong>${r.pa}</strong><small>Points Against</small></div></div></aside></div>`)}
function showTeams(){location.hash='teams';document.getElementById("app").innerHTML=shell(`<section class="statsHero"><div class="kicker">27 PROGRAMS</div><h1>Team Directory</h1><p>Every current U SPORTS football program, using its real athletics identity.</p></section><div class="teamGrid">${TEAMS.map(teamCard).join('')}</div>`)}
function showConferences(){location.hash='conferences';let cs=['OUA','RSEQ','AUS','CW'];document.getElementById("app").innerHTML=shell(`<section class="statsHero"><div class="kicker">4 CONFERENCES</div><h1>Conference Hubs</h1></section>${cs.map(c=>`<section class="panel" style="margin-bottom:12px"><h2>${cl(c)}</h2><div class="confTeamGrid">${TEAMS.filter(t=>t.conference===c).map(teamCard).join('')}</div></section>`).join('')}`)}
function route(){let h=location.hash.slice(1);if(h.startsWith('game='))showGame(h.slice(5));else if(h.startsWith('team='))showTeam(h.slice(5));else if(h==='leaders')showLeaders();else if(h==='teamstats')showTeamStats();else if(h==='teams')showTeams();else if(h==='conferences')showConferences();else renderHome()}
window.addEventListener('hashchange',()=>{if(location.hash)route()});route();

/* === V25 pregame rendering and live handoff === */
const _showGameCastLiveV25 = showGameCast;
const _applyRealtimeEventV25 = applyRealtimeEvent;
function preRecord(slug,current){
  const out={w:0,l:0,pf:0,pa:0,gp:0};
  GAMES.filter(g=>g.status==='final' && (g.away===slug||g.home===slug) && (!current || g.date < current.date)).forEach(g=>{
    const own=g.away===slug?g.awayScore:g.homeScore, opp=g.away===slug?g.homeScore:g.awayScore;
    out.gp++; out.pf+=Number(own||0); out.pa+=Number(opp||0); if(own>opp) out.w++; else out.l++;
  });
  return out;
}
function fmtPct(x){return (Math.round(x*10)/10).toFixed(1)+'%'}
function perGame(total,gp){return gp? (Math.round((total/gp)*10)/10).toFixed(1):'—'}
function teamLeaderByCat(slug,cat){const row=(LEADERS[cat]||[]).find(x=>x.team===slug);return row?{name:row.name, value:row.yards, label:'yds'}:null}
function pregameStory(game){
  const pool=(MEDIA_FEED||[]).filter(x=>(x.teams||[]).includes(game.away)||(x.teams||[]).includes(game.home)).sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  if(pool[0]) return pool[0];
  return {title:`${TEAM[game.away].short} at ${TEAM[game.home].short}: what to know before kickoff`,source:'U SPORTS Football Game Centre',date:game.date,url:'#'};
}
function teamNewsStories(slugs,limit=4){
  return (MEDIA_FEED||[]).filter(x=>(x.teams||[]).some(t=>slugs.includes(t))).sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,limit);
}
function lastFiveRows(slug,current){
  return GAMES.filter(g=>g.status==='final' && (g.away===slug||g.home===slug) && (!current || g.date < current.date)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);
}
function opponentSlug(g,slug){return g.away===slug?g.home:g.away}
function teamComparisonRows(game){
  const ar=preRecord(game.away,game), hr=preRecord(game.home,game);
  const aOff=OFFENSE?.[game.away]||{games:0,total:0,pass:0,rush:0};
  const hOff=OFFENSE?.[game.home]||{games:0,total:0,pass:0,rush:0};
  return [
    ['Record',`${ar.w}-${ar.l}`,`${hr.w}-${hr.l}`],
    ['Points / Game',perGame(ar.pf,ar.gp),perGame(hr.pf,hr.gp)],
    ['Points Allowed / Game',perGame(ar.pa,ar.gp),perGame(hr.pa,hr.gp)],
    ['Point Differential / Game',ar.gp?(((ar.pf-ar.pa)/ar.gp).toFixed(1)):'—',hr.gp?(((hr.pf-hr.pa)/hr.gp).toFixed(1)):'—'],
    ['Total Offense / Game',aOff.games?((aOff.total/aOff.games).toFixed(1)):'—',hOff.games?((hOff.total/hOff.games).toFixed(1)):'—'],
    ['Passing Yards / Game',aOff.games?((aOff.pass/aOff.games).toFixed(1)):'—',hOff.games?((hOff.pass/hOff.games).toFixed(1)):'—'],
    ['Rushing Yards / Game',aOff.games?((aOff.rush/aOff.games).toFixed(1)):'—',hOff.games?((hOff.rush/hOff.games).toFixed(1)):'—'],
    ['Games Played',String(ar.gp),String(hr.gp)]
  ]
}
function matchupPredictor(game){
  const ar=preRecord(game.away,game), hr=preRecord(game.home,game);
  const awayWin=ar.gp?ar.w/ar.gp:.5, homeWin=hr.gp?hr.w/hr.gp:.5;
  const awayDiff=ar.gp?(ar.pf-ar.pa)/ar.gp:0, homeDiff=hr.gp?(hr.pf-hr.pa)/hr.gp:0;
  const awayOff=ar.gp?ar.pf/ar.gp:24, homeOff=hr.gp?hr.pf/hr.gp:24;
  const awayDef=ar.gp?ar.pa/ar.gp:24, homeDef=hr.gp?hr.pa/hr.gp:24;
  const awayRating=awayWin*42 + awayDiff*1.15 + awayOff*.55 - awayDef*.35;
  const homeRating=homeWin*42 + homeDiff*1.15 + homeOff*.55 - homeDef*.35 + 3.5;
  const homePct=100/(1+Math.exp(-(homeRating-awayRating)/7));
  return {home:Math.max(5,Math.min(95,homePct)), away:100-Math.max(5,Math.min(95,homePct))};
}
function confStandings(conf,current){
  const map={};
  TEAMS.filter(t=>t.conference===conf).forEach(t=>map[t.slug]={slug:t.slug,w:0,l:0,pf:0,pa:0,gp:0});
  GAMES.filter(g=>g.status==='final' && g.conference===conf && (!current || g.date < current.date)).forEach(g=>{
    const A=map[g.away], H=map[g.home]; if(!A||!H) return;
    A.gp++; H.gp++; A.pf+=g.awayScore; A.pa+=g.homeScore; H.pf+=g.homeScore; H.pa+=g.awayScore;
    if(g.awayScore>g.homeScore){A.w++;H.l++;} else {H.w++;A.l++;}
  });
  return Object.values(map).sort((a,b)=>b.w-a.w || ((b.pf-b.pa)-(a.pf-a.pa)) || b.pf-a.pf || TEAM[a.slug].short.localeCompare(TEAM[b.slug].short));
}
function preLastFiveTable(slug,current,right=false){
  const rows=lastFiveRows(slug,current);
  const t=TEAM[slug];
  return `<div><div class="teamMiniHead ${right?'right':''}">${right?`<b>${esc(t.short)}</b><img src="${t.logo}" alt="${esc(t.short)}">`:`<img src="${t.logo}" alt="${esc(t.short)}"><b>${esc(t.short)}</b>`}</div><table class="miniSchedule"><thead><tr><th>Date</th><th>Opp</th><th>Result</th></tr></thead><tbody>${rows.length?rows.map(g=>{const opp=TEAM[opponentSlug(g,slug)],home=g.home===slug,own=home?g.homeScore:g.awayScore,oppScore=home?g.awayScore:g.homeScore,res=own>oppScore?'W':'L';return `<tr><td>${new Date(g.date+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'})}</td><td>${home?'vs ':'@ '}${esc(opp.short)}</td><td><b style="color:${res==='W'?'#67e089':'#ff8181'}">${res}</b> ${own}-${oppScore}</td></tr>`}).join(''):`<tr><td colspan="3" style="color:var(--muted)">No games played yet.</td></tr>`}</tbody></table></div>`
}
function leaderCompareCell(slug,cat,home=false){
  const row=teamLeaderByCat(slug,cat);
  if(!row) return `<div class="leaderName">—</div><div class="leaderDetail">No verified leader loaded</div>`;
  return `<div class="leaderName">${esc(row.name)}</div><div class="leaderDetail">${row.value} ${row.label}</div>`;
}
function pregameLeaders(game){
  const cats=[['pass','Passing Yards'],['rush','Rushing Yards'],['receive','Receiving Yards']];
  return `<div class="leadersCompare">${cats.map(([cat,label])=>`<div class="leaderCompareRow"><div class="leaderSide">${leaderCompareCell(game.away,cat,false)}</div><div class="leaderStatMid">${label}</div><div class="leaderSide home">${leaderCompareCell(game.home,cat,true)}</div></div>`).join('')}<div class="leaderCompareRow"><div class="leaderSide"><div class="leaderName">Defensive leaders</div><div class="leaderDetail">Populate when gamebooks expose tackles / sacks tables</div></div><div class="leaderStatMid">Tackles / Sacks</div><div class="leaderSide home"><div class="leaderName">Defensive leaders</div><div class="leaderDetail">Populate when gamebooks expose tackles / sacks tables</div></div></div></div>`
}
function pregameComparisonTable(game){
  const a=TEAM[game.away], h=TEAM[game.home], rows=teamComparisonRows(game);
  return `<table class="teamCompTable"><thead><tr><th>${esc(a.short)}</th><th></th><th></th><th>${esc(h.short)}</th></tr></thead><tbody>${rows.map(r=>`<tr><td><b>${r[1]}</b></td><td></td><td>${esc(r[0])}</td><td><b>${r[2]}</b></td></tr>`).join('')}</tbody></table>`
}
function pregameStoriesBlock(game){
  const stories=teamNewsStories([game.away,game.home],6);
  return stories.length?stories.map(s=>`<a class="newsStory" href="${s.url}" target="_blank" rel="noopener"><div class="newsTitle">${esc(s.title)}</div><div class="newsMeta">${esc(s.source||'Source')} • ${esc(s.date||'')}</div></a>`).join(''):'<div class="subtle">No related stories loaded yet for these teams.</div>'
}
function standingsTableHTML(conf,current){
  const rows=confStandings(conf,current).slice(0,8);
  return `<table class="standingsTableV25"><thead><tr><th>Team</th><th>W</th><th>L</th><th>PF</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(TEAM[r.slug].short)}</td><td>${r.w}</td><td>${r.l}</td><td>${r.pf}</td></tr>`).join('')}</tbody></table>`
}
function formatGameDateLong(g){
  return new Date(g.date+'T12:00:00').toLocaleDateString('en-CA',{weekday:'short',month:'long',day:'numeric',year:'numeric'})
}
function renderPregameGameCast(id){
  const game=GAMES.find(x=>x.id===id); if(!game){_showGameCastLiveV25(id);return}
  LIVE_STORE.selected=id; location.hash='live='+id;
  if(!LIVE_STORE.games[id]) LIVE_STORE.games[id]={id,away:game.away,home:game.home,as:game.awayScore||0,hs:game.homeScore||0,q:'PRE',clock:game.time,pos:game.away,down:'Kickoff',yard:50,first:60,event:'UPCOMING'};
  const a=TEAM[game.away], h=TEAM[game.home], ar=preRecord(game.away,game), hr=preRecord(game.home,game), pred=matchupPredictor(game), story=pregameStory(game), homePct=pred.home.toFixed(1), awayPct=pred.away.toFixed(1);
  const content=`<div class="pregameHub"><button class="back" onclick="goHome()">← National schedule</button><div class="pregameNotice"><b>Pregame mode.</b> This ESPN-style preview stays up until the first live event hits. As soon as the realtime connector receives score / clock / play data, the page will automatically hand off to the live GameCast field and play ribbons.</div><section class="pregameTopHero"><div class="pregameStatusLine"><span>${cl(game.conference)} • ${formatGameDateLong(game)}</span><span class="pregameKickBadge">Scheduled kickoff • ${esc(game.time)}</span></div><div class="pregameHeroGrid"><div class="pregameTeamCard"><div class="pregameLogoWrap"><img src="${a.logo}" alt="${esc(a.short)}"></div><div><h2>${esc(a.name)}</h2><div class="pregameMeta"><span>${esc(a.city)}</span><span class="pregameRecordPill">${ar.w}-${ar.l} record</span></div></div></div><div class="pregameMidCard"><div class="pregameTime">${esc(game.time)}</div><div class="pregameDate">${formatGameDateLong(game)}</div><div class="pregameVenue">${esc(game.venue||'Venue TBA')}</div><div class="pregameMetaRow"><span class="pregameChip">${cl(game.conference)}</span><span class="pregameChip">U SPORTS Football</span><span class="pregameChip">Dark-mode Pregame</span></div></div><div class="pregameTeamCard home"><div><h2>${esc(h.name)}</h2><div class="pregameMeta"><span class="pregameRecordPill">${hr.w}-${hr.l} record</span><span>${esc(h.city)}</span></div></div><div class="pregameLogoWrap"><img src="${h.logo}" alt="${esc(h.short)}"></div></div></div></section><div class="pregameGrid"><main class="pregameMain"><section class="gcPregameCard"><h3>Matchup Predictor</h3><div class="predictorWrap"><div class="predictorDonutWrap"><div class="predictorDonut" style="--home-color:${h.primary};--away-color:${a.primary};--home-pct:${homePct}%"><div class="predictorInner"><div class="dualMarks"><div class="miniMark"><img src="${a.logo}" alt="${esc(a.short)}"></div><div class="miniMark"><img src="${h.logo}" alt="${esc(h.short)}"></div></div><b>Pre-Kick Win Index</b></div></div><div class="subtle">Model blend of record, point differential and home field. This block disappears once live stats take over.</div></div><div><div class="predictorNumbers"><div class="predictorPct"><small>${esc(a.short)}</small><b>${awayPct}%</b></div><div class="predictorPct"><small>${esc(h.short)}</small><b>${homePct}%</b></div></div><div class="predictorBlurb">${esc(h.short)} carries the home-field edge, while ${esc(a.short)} arrives with its own early-season profile. This module is here to give the matchup page substance before kickoff, then yield to the live feed automatically.</div><div class="pregameActionRow"><button onclick="connectProductionRealtime()">RECHECK LIVE FEED</button><a href="#team=${game.away}">OPEN ${esc(a.short).toUpperCase()} PAGE</a><a href="#team=${game.home}">OPEN ${esc(h.short).toUpperCase()} PAGE</a></div></div></div></section><section class="gcPregameCard"><div class="storyKicker">Preview</div><div class="previewHeadline">${esc(story.title)}</div><div class="previewDeck">${esc(TEAM[game.away].short)} and ${esc(TEAM[game.home].short)} drop into an ESPN-style matchup page here before kickoff: big-stage intro, team comparison, season leaders, recent form, conference context, and linked coverage. When a live score / play-by-play source is available, the game page transitions into the rich GameCast automatically.</div><div class="storySourceLine"><span>${esc(story.source||'U SPORTS coverage')}</span><span>•</span><span>${esc(story.date||game.date)}</span>${story.url && story.url !== '#' ? `<a href="${story.url}" target="_blank" rel="noopener">Open story ↗</a>`:''}</div></section><section class="gcPregameCard"><h3>Season Leaders</h3>${pregameLeaders(game)}</section><section class="gcPregameCard"><h3>Team Comparison</h3>${pregameComparisonTable(game)}</section><section class="gcPregameCard"><h3>Last Five Games</h3><div class="lastFiveGrid">${preLastFiveTable(game.away,game,false)}${preLastFiveTable(game.home,game,true)}</div></section></main><aside class="pregameRail"><section class="gcPregameCard"><h3>Game Information</h3><div class="infoGrid"><div class="infoItem"><small>Date</small><b>${formatGameDateLong(game)}</b></div><div class="infoItem"><small>Kickoff</small><b>${esc(game.time)}</b></div><div class="infoItem"><small>Venue</small><b>${esc(game.venue||'Venue TBA')}</b></div><div class="infoItem"><small>Conference</small><b>${cl(game.conference)}</b></div><div class="infoItem"><small>Away Record</small><b>${ar.w}-${ar.l}</b></div><div class="infoItem"><small>Home Record</small><b>${hr.w}-${hr.l}</b></div></div></section><section class="gcPregameCard"><h3>Conference Standings</h3>${standingsTableHTML(game.conference,game)}</section><section class="gcPregameCard"><h3>Team Stories</h3><div class="newsStack">${pregameStoriesBlock(game)}</div></section><section class="gcPregameCard"><div class="feedReady"><span class="dot"></span><div><b>Live feed handoff ready.</b><br>The page is wired so the first realtime event can replace this preview with the live field, scorebug, side scoreboard and hero play ribbons.</div></div></section></aside></div></div>`;
  document.getElementById('app').innerHTML=shell(content,'live');
  connectProductionRealtime();
}
showGameCast=function(id){
  const g=GAMES.find(x=>x.id===id), liveState=LIVE_STORE.games[id];
  const isPregameGame=!!g && g.status!=='final' && (!liveState || !liveState.q || ['PRE','UPCOMING'].includes(String(liveState.q).toUpperCase()));
  if(isPregameGame) return renderPregameGameCast(id);
  return _showGameCastLiveV25(id);
}
applyRealtimeEvent=function(e){
  const selected=LIVE_STORE.selected;
  if(selected && e.game_id===selected && document.querySelector('.pregameHub')){
    const nextQ=e?.state?.q?String(e.state.q).toUpperCase():'';
    const shouldFlip=!!(e.play || (nextQ && !['PRE','UPCOMING'].includes(nextQ)) || ['KICKOFF','FIRST DOWN','TOUCHDOWN','FIELD GOAL','INTERCEPTION','FUMBLE'].includes(String(e.type||'').toUpperCase()));
    if(shouldFlip){ _showGameCastLiveV25(selected); }
  }
  return _applyRealtimeEventV25(e);
}

 ['3rd down',`${s1.thirdMade}/${s1.thirdAtt}`,`${s2.thirdMade}/${s2.thirdAtt}`],['Sacks allowed',s1.sacks,s2.sacks],
 ['Penalties',`${s1.pen}-${s1.penYds}`,`${s2.pen}-${s2.penYds}`],['Possession',s1.poss,s2.poss],
 ['Punts',`${s1.punts}-${s1.puntYds}`,`${s2.punts}-${s2.puntYds}`],['Punt returns',`${s1.pr}-${s1.prYds}`,`${s2.pr}-${s2.prYds}`],

}

       if(type==='rushing'){x.att=(x.att||0)+row[1];x.yds=(x.yds||0)+row[2];x.td=(x.td||0)+row[3];x.long=Math.max(x.long||0,row[4])}
       if(type==='receiving'){x.rec=(x.rec||0)+row[1];x.yds=(x.yds||0)+row[2];x.td=(x.td||0)+row[3];x.long=Math.max(x.long||0,row[4])}
       map.set(k,x)
     }
   }
 } return [...map.values()]
}
showLeaders=function(cat='passing'){
 location.hash='leaders';let rows=[],headers=[];
 if(cat==='passing'){rows=nationalPlayers('passing').sort((a,b)=>b.yds-a.yds);headers=['#','Player','Team','G','CMP','ATT','CMP%','YDS','Y/A','TD','INT','SACK','LONG','EFF'];rows=rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.name}</b></td><td>${TEAM[x.team].short}</td><td>${x.games}</td><td>${x.cmp}</td><td>${x.att}</td><td>${(x.cmp/x.att*100).toFixed(1)}</td><td><b>${x.yds}</b></td><td>${(x.yds/x.att).toFixed(1)}</td><td>${x.td}</td><td>${x.int}</td><td>${x.sacks}</td><td>${x.long}</td><td>${((8.4*x.yds+330*x.td+100*x.cmp-200*x.int)/x.att).toFixed(1)}</td></tr>`)}
 if(cat==='rushing'){rows=nationalPlayers('rushing').sort((a,b)=>b.yds-a.yds);headers=['#','Player','Team','G','ATT','YDS','AVG','TD','LONG'];rows=rows.map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.name}</b></td><td>${TEAM[x.team].short}</td><td>${x.games}</td><td>${x.att}</td><td><b>${x.yds}</b></td><td>${(x.yds/x.att).toFixed(1)}</td><td>${x.td}</td><td>${x.long}</td></tr>`)}

};

// Aggregate rich team data across normalized completed games
function nationalTeams(){
 const out=Object.fromEntries(TEAMS.map(t=>[t.slug,{g:0,off:{},def:{},st:{}}]));
 const add=(o,k,v)=>(o[k]=(o[k]||0)+(Number(v)||0));
 for(const [id,d] of Object.entries(RICH_GAMES)){
   let g=GAMES.find(x=>x.id===id); if(!g)continue;
   for(const [slug,own,opp] of [[g.away,d.awayStats,d.homeStats],[g.home,d.homeStats,d.awayStats]]){
     let x=out[slug];x.g++;
     for(const k of ['first','rushYds','rushAtt','passYds','comp','att','int','passTD','rushTD','totalYds','plays','fumLost','thirdMade','thirdAtt','sacks'])add(x.off,k,own[k]);
     for(const k of ['first','rushYds','rushAtt','passYds','comp','att','int','passTD','rushTD','totalYds','plays','fumLost','thirdMade','thirdAtt','sacks'])add(x.def,k,opp[k]);
     for(const k of ['punts','puntYds','pr','prYds','kr','krYds','fgm','fga','patm','pata'])add(x.st,k,own[k]);
   }
 } return out
}

 if(tab==='defense'){headers=['#','Team','G','Plays','Yds Allowed','Y/G','YPP','Rush Att','Rush Yds','Rush Avg','Comp','Att','Comp%','Pass Yds','Y/A','Pass TD','INT Forced','3D%','Takeaways','Sacks'];list.sort((a,b)=>N[a.slug].def.totalYds/N[a.slug].g-N[b.slug].def.totalYds/N[b.slug].g);rows=list.map((t,i)=>{let x=N[t.slug],o=x.def;return `<tr><td>${i+1}</td><td><b>${t.short}</b></td><td>${x.g}</td><td>${o.plays}</td><td><b>${o.totalYds}</b></td><td>${(o.totalYds/x.g).toFixed(1)}</td><td>${(o.totalYds/o.plays).toFixed(1)}</td><td>${o.rushAtt}</td><td>${o.rushYds}</td><td>${(o.rushYds/o.rushAtt).toFixed(1)}</td><td>${o.comp}</td><td>${o.att}</td><td>${(o.comp/o.att*100).toFixed(1)}</td><td>${o.passYds}</td><td>${(o.passYds/o.att).toFixed(1)}</td><td>${o.passTD}</td><td>${o.int}</td><td>${o.thirdAtt?(o.thirdMade/o.thirdAtt*100).toFixed(1):'—'}</td><td>${o.int+o.fumLost}</td><td>${o.sacks}</td></tr>`})}
 if(tab==='special'){headers=['#','Team','G','FGM','FGA','FG%','XPM','XPA','Punts','Punt Avg','PR','PR Yds','PR Avg','KR','KR Yds','KR Avg'];rows=list.map((t,i)=>{let x=N[t.slug],s=x.st;return `<tr><td>${i+1}</td><td><b>${t.short}</b></td><td>${x.g}</td><td>${s.fgm}</td><td>${s.fga}</td><td>${s.fga?(s.fgm/s.fga*100).toFixed(1):'—'}</td><td>${s.patm}</td><td>${s.pata}</td><td>${s.punts}</td><td>${s.punts?(s.puntYds/s.punts).toFixed(1):'—'}</td><td>${s.pr}</td><td>${s.prYds}</td><td>${s.pr?(s.prYds/s.pr).toFixed(1):'—'}</td><td>${s.kr}</td><td>${s.krYds}</td><td>${s.kr?(s.krYds/s.kr).toFixed(1):'—'}</td></tr>`})}
 document.getElementById('app').innerHTML=shell(`<section class="statsHero"><div class="kicker">NATIONAL TEAM DATABASE</div><h1>Team Stats</h1><p>Offense, defense and special teams aggregated from the completed full gamebooks normalized in V6.</p><div class="coverageBar"><span class="coveragePill good">${Object.keys(RICH_GAMES).length} FULL GAMEBOOKS</span><span class="coveragePill warn">${Object.keys(LIMITED_GAMES).length} SOURCE-LIMITED</span></div></section><div class="metricTabs"><button class="${tab==='offense'?'active':''}" onclick="showTeamStats('offense')">Offense</button><button class="${tab==='defense'?'active':''}" onclick="showTeamStats('defense')">Defense</button><button class="${tab==='special'?'active':''}" onclick="showTeamStats('special')">Special Teams</button></div><div class="panel">${richTable(headers,rows)}</div>`,'teamstats')
};

<script>

      id:g.id,away:g.away,home:g.home,

      event:'UPCOMING',_realLive:false

function isUpset(g){
  if(!g || g._realLive!==true) return false;
  if(g.event==='UPSET ALERT') return true;
  if(g.rankHome && !g.rankAway && g.as>g.hs && (g.q==='Q4'||g.q==='Q3')) return true;
  if(g.rankAway && !g.rankHome && g.hs>g.as && (g.q==='Q4'||g.q==='Q3')) return true;
  return false;
}

  const a=TEAM[g.away],h=TEAM[g.home],up=isUpset(g);

  </div>`;
}
function renderOtherGames(){
  const el=document.getElementById('otherGames'); if(!el)return;
  el.innerHTML=Object.values(LIVE_STORE.games).filter(g=>g.id!==LIVE_STORE.selected).map(otherGameCard).join('');
}
function selectedGame(){return LIVE_STORE.games[LIVE_STORE.selected]}
function fieldX(yard){return Math.max(8,Math.min(92,8+(yard/100)*84))}
function fieldEventClass(type){
  if(['TOUCHDOWN','INTERCEPTION','FUMBLE','SAFETY','BLOCKED KICK','PICK SIX'].includes(type))return 'score';
  if(['FIRST DOWN','END Q1','END Q2','HALFTIME','END Q3'].includes(type))return 'micro';
  return '';
}
function showRibbon(type,title,sub,color='#fff'){
  const r=document.getElementById('heroRibbon');if(!r)return;
  r.className='heroRibbon '+fieldEventClass(type);
  r.style.setProperty('--eventColor',color);
  r.querySelector('.ribbonType').textContent=type;
  r.querySelector('.ribbonTitle').textContent=title;
  r.querySelector('.ribbonSub').textContent=sub||'';
  requestAnimationFrame(()=>r.classList.add('show'));
  clearTimeout(r._hide);r._hide=setTimeout(()=>r.classList.remove('show'),type==='TOUCHDOWN'?3000:2200);
}
function updateSelectedUI(){
  const g=selectedGame();if(!g)return;
  const a=TEAM[g.away],h=TEAM[g.home],off=TEAM[g.pos];
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('castAwayName',a.short);set('castHomeName',h.short);set('castAwayScore',g.as);set('castHomeScore',g.hs);
  set('castStatus',`${g.q} • ${g.clock}`);set('castDown',`${g.down} • ${off.abbr} BALL`);
  set('fieldHud',`${off.short.toUpperCase()} BALL • ${g.down}`);
  const ball=document.getElementById('fieldBall'),los=document.getElementById('losLine'),first=document.getElementById('firstLine');
  if(ball){ball.style.left=fieldX(g.yard)+'%';los.style.left=fieldX(g.yard)+'%';first.style.left=fieldX(g.first)+'%'}
  const am=document.getElementById('castAwayMark'),hm=document.getElementById('castHomeMark');
  if(am){am.outerHTML=mark(a,'hero').replace('class="badgeMark hero"','class="badgeMark hero" id="castAwayMark"')}
  if(hm){hm.outerHTML=mark(h,'hero').replace('class="badgeMark hero"','class="badgeMark hero" id="castHomeMark"')}
  const p=document.getElementById('playItems');if(p)p.innerHTML=(LIVE_STORE.plays[g.id]||[]).slice(0,12).map(x=>`<div class="playItem"><div class="playClock">${x.q}<br>${x.clock}</div><div class="playText">${x.text}<span class="eventChip">${x.type}</span></div></div>`).join('');
  set('metaYPP','—');set('metaExpl','—');set('metaTO','—');set('metaDrive','—');
  renderOtherGames();
}
function showGameCast(id){
  if(!LIVE_STORE.games[id]){const sg=GAMES.find(x=>x.id===id);if(sg){LIVE_STORE.games[id]={id,away:sg.away,home:sg.home,as:sg.awayScore||0,hs:sg.homeScore||0,q:'PRE',clock:sg.time,pos:sg.away,down:'Kickoff',yard:50,first:60,event:'UPCOMING'}}else return}
  LIVE_STORE.selected=id;location.hash='live='+id;const g=selectedGame(),a=TEAM[g.away],h=TEAM[g.home];
  const content=`<div class="liveHub"><button class="back" onclick="goHome()">← National schedule</button>
    <div id="liveConnection" class="demoNotice">Live Demo uses the exact same event handler as the production realtime connector. No live Presto endpoint is connected in this local file yet.</div>
    <div class="liveLayout"><main>
      <section class="castPanel">
        <div class="castScore">
          <div class="castTeam"><span class="badgeMark hero" id="castAwayMark" style="background:${a.primary};color:${a.secondary}">${a.abbr}</span><div><b id="castAwayName">${a.short}</b><small>${a.city}</small></div></div>
          <div class="castCenter"><div class="castStatus" id="castStatus">${g.q} • ${g.clock}</div><div class="castBigScore"><span id="castAwayScore">${g.as}</span>–<span id="castHomeScore">${g.hs}</span></div><div class="castDown" id="castDown">${g.down}</div></div>
          <div class="castTeam home"><div><b id="castHomeName">${h.short}</b><small>${h.city}</small></div><span class="badgeMark hero" id="castHomeMark" style="background:${h.primary};color:${h.secondary}">${h.abbr}</span></div>
        </div>
        <div class="fieldStage"><div class="liveField"><div class="fieldNums"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>40</span><span>30</span><span>20</span><span>10</span></div><div class="fieldHud" id="fieldHud"></div><div class="losLine" id="losLine"></div><div class="firstLine" id="firstLine"></div><div class="fieldBall" id="fieldBall"></div>
          <div class="heroRibbon" id="heroRibbon"><div class="ribbonType"></div><div class="ribbonTitle"></div><div class="ribbonSub"></div></div>
        </div></div>
        <div class="liveMetaStrip"><div class="liveMeta"><strong id="metaYPP">—</strong><small>YPP</small></div><div class="liveMeta"><strong id="metaExpl">—</strong><small>EXPLOSIVES</small></div><div class="liveMeta"><strong id="metaTO">—</strong><small>TURNOVERS</small></div><div class="liveMeta"><strong id="metaDrive">—</strong><small>DRIVE</small></div></div>
        <div class="castToolbar"><button onclick="startLiveDemo()">▶ LIVE DEMO</button><button onclick="stopLiveDemo()">STOP</button><button onclick="demoEvent('FIRST DOWN')">FIRST DOWN</button><button onclick="demoEvent('EXPLOSIVE')">EXPLOSIVE</button><button onclick="demoEvent('TOUCHDOWN')">TOUCHDOWN</button><button onclick="demoEvent('INTERCEPTION')">TURNOVER</button><button onclick="demoEvent('END Q3')">END QTR</button><button onclick="demoEvent('HALFTIME')">HALFTIME</button></div>

    </main><aside class="liveSide"><div class="liveSideHead"><h3><span class="pulseDot"></span>Live Around U SPORTS</h3><small style="color:var(--muted)">tap to switch</small></div><div class="otherGames" id="otherGames"></div></aside></div></div>`;
  document.getElementById('app').innerHTML=shell(content,'live');updateSelectedUI();connectProductionRealtime();
}
function applyRealtimeEvent(e){
  const g=LIVE_STORE.games[e.game_id];if(!g)return;
  const oldA=g.as,oldH=g.hs;
  Object.assign(g,e.state||{});
  if(e.play){LIVE_STORE.plays[e.game_id]=[{q:g.q,clock:g.clock,text:e.play.description,type:e.type||'PLAY'},...(LIVE_STORE.plays[e.game_id]||[])].slice(0,50)}
  const card=document.getElementById('og-'+e.game_id);
  if(card){
    if(g.as!==oldA||g.hs!==oldH){card.style.setProperty('--flash',TEAM[e.scoring_team||g.pos].primary);card.classList.add('flashScore');setTimeout(()=>card.classList.remove('flashScore'),1900)}
    if(['INTERCEPTION','FUMBLE','TURNOVER ON DOWNS'].includes(e.type)){card.classList.add('flashTurnover');setTimeout(()=>card.classList.remove('flashTurnover'),1900)}
    if(['END Q1','END Q2','HALFTIME','END Q3'].includes(e.type)){card.classList.add('quarterState');setTimeout(()=>card.classList.remove('quarterState'),2600)}
  }
  if(e.game_id===LIVE_STORE.selected){
    updateSelectedUI();
    const color=TEAM[e.team||g.pos]?.primary||'#fff';
    const title=e.title||e.type||'UPDATE',sub=e.subtitle||e.play?.description||'';
    showRibbon(e.type||'UPDATE',title,sub,color);
  } else renderOtherGames();
}
const DEMO_EVENTS=[];
function demoEvent(type){} function startLiveDemo(){} function stopLiveDemo(){}
function connectProductionRealtime(){
  const banner=document.getElementById('liveConnection');
  // Production hook: set window.USPORTS_LIVE_ENDPOINT to an SSE endpoint when deployed.
  if(location.protocol.startsWith('http')&&window.USPORTS_LIVE_ENDPOINT){
    try{
      const es=new EventSource(window.USPORTS_LIVE_ENDPOINT);
      es.onopen=()=>{LIVE_STORE.connected=true;if(banner){banner.className='demoNotice realtimeOk';banner.textContent='REALTIME CONNECTED • league scoreboard + selected-game play stream'}};
      es.onmessage=msg=>{try{applyRealtimeEvent(JSON.parse(msg.data))}catch(_){}};
      es.onerror=()=>{if(banner){banner.className='demoNotice';banner.textContent='Realtime endpoint disconnected. GameCast remains available; reconnecting…'}};
    }catch(_){}
  }
}
function showLiveHub(){if(!LIVE_STORE.selected)seedLiveGames();showGameCast(LIVE_STORE.selected)}
seedLiveGames();

shell=function(content,active='schedule'){return `<div class="shell"><header class="topbar"><button class="brand" onclick="goHome()" style="background:none;border:0;color:inherit;padding:0"><span class="roundel">U</span><span>U SPORTS<small>FOOTBALL</small></span></button><nav class="nav"><button class="${active==='live'?'active':''}" onclick="showLiveHub()">Live</button><button class="${active==='schedule'?'active':''}" onclick="goHome()">Schedule</button><button class="${active==='leaders'?'active':''}" onclick="showLeaders()">Leaders</button><button class="${active==='teamstats'?'active':''}" onclick="showTeamStats()">Team Stats</button><button onclick="showTeams()">Teams</button><button onclick="showConferences()">Conferences</button></nav></header>${content}<div class="footer">U SPORTS Football Game Centre • V7 • Saturday Command Centre</div></div>`};

<script>

applyRealtimeEvent = function(e){
  const g = LIVE_STORE.games[e.game_id]; if(!g) return;
  const oldA = g.as, oldH = g.hs;

  if(e.play){
    LIVE_STORE.plays[e.game_id] = [{
      q: g.q, clock: g.clock, text: e.play.description, type: e.type || 'PLAY'
    }, ...(LIVE_STORE.plays[e.game_id] || [])].slice(0,50);
  }
  const card = document.getElementById('og-' + e.game_id);
  if(card){
    if(g.as !== oldA || g.hs !== oldH){
      const flashTeam = TEAM[e.scoring_team || e.team || g.pos] || TEAM[g.home];
      card.style.setProperty('--flash', flashTeam.primary);
      card.classList.add('flashScore');
      setTimeout(()=>card.classList.remove('flashScore'),1900);
    }
    if(['INTERCEPTION','FUMBLE','TURNOVER ON DOWNS'].includes(e.type)){
      card.classList.add('flashTurnover');
      setTimeout(()=>card.classList.remove('flashTurnover'),1900);
    }
    if(['END Q1','END Q2','HALFTIME','END Q3'].includes(e.type)){
      card.classList.add('quarterState');
      setTimeout(()=>card.classList.remove('quarterState'),2600);
    }
  }
  if(e.game_id === LIVE_STORE.selected){
    updateSelectedUI();
    const teamSlug = e.team || g.pos || g.home;
    showRibbonEvent({
      type: e.type || 'UPDATE',
      title: e.title || e.type || 'UPDATE',
      subtitle: e.subtitle || e.play?.description || '',
      color: (TEAM[teamSlug] || TEAM[g.home]).primary,

      player_image: e.player_image || '',

      team_short: TEAM[teamSlug]?.short || ''
    });
  } else {
    renderOtherGames();
  }
};

<script>
/* V21: make every team-page tab functional */
function teamGamesV21(slug){return GAMES.filter(g=>g.away===slug||g.home===slug).sort((a,b)=>a.date.localeCompare(b.date))}
function gameRowV21(g,slug){
  const opp=TEAM[g.away===slug?g.home:g.away],home=g.home===slug,fin=g.status==='final',own=home?g.homeScore:g.awayScore,other=home?g.awayScore:g.homeScore;
  return `<div class="sched" ${fin?`onclick="showGame('${g.id}')" style="cursor:pointer"`:''}><div class="schedDate"><b>${new Date(g.date+'T12:00:00').toLocaleDateString('en-CA',{month:'short',day:'numeric'})}</b><span>${g.time}</span></div><div><div class="opp">${home?'vs':'at'} ${esc(opp.name)}</div><small>${fin?'Final • open box score':esc(g.venue||'')}</small></div><div class="result">${fin?`${own}–${other}`:'UPCOMING'}</div></div>`
}
function teamPlayersV21(slug){
  const map=new Map();
  if(typeof RICH_GAMES!=='undefined'){
    for(const d of Object.values(RICH_GAMES)){
      for(const type of ['passing','rushing','receiving']){
        for(const row of (d[type]?.[slug]||[])){
          const name=row[0],x=map.get(name)||{name,pass:null,rush:null,rec:null};
          if(type==='passing')x.pass={cmp:row[1],att:row[2],yds:row[3],td:row[4],int:row[5]};
          if(type==='rushing')x.rush={att:row[1],yds:row[2],td:row[3]};
          if(type==='receiving')x.rec={rec:row[1],yds:row[2],td:row[3]};
          map.set(name,x);
        }
      }
    }
  }
  return [...map.values()].sort((a,b)=>Math.max(b.pass?.yds||0,b.rush?.yds||0,b.rec?.yds||0)-Math.max(a.pass?.yds||0,a.rush?.yds||0,a.rec?.yds||0));
}
function playerCardV21(p){
  const bits=[];
  if(p.pass)bits.push(`${p.pass.cmp}/${p.pass.att} • ${p.pass.yds} pass yds • ${p.pass.td} TD • ${p.pass.int} INT`);
  if(p.rush)bits.push(`${p.rush.att} rush • ${p.rush.yds} yds • ${p.rush.td} TD`);
  if(p.rec)bits.push(`${p.rec.rec} rec • ${p.rec.yds} yds • ${p.rec.td} TD`);
  return `<div class="playerCardV21"><b>${esc(p.name)}</b><small>2026 normalized gamebook</small><div class="playerLineV21">${bits.join('<br>')}</div></div>`;
}
function teamAggregateV21(slug){
  const x={g:0,plays:0,yds:0,rushAtt:0,rushYds:0,comp:0,att:0,passYds:0,passTD:0,int:0,first:0,thirdMade:0,thirdAtt:0,punts:0,puntYds:0,fgm:0,fga:0};
  if(typeof RICH_GAMES!=='undefined'){
    for(const [id,d] of Object.entries(RICH_GAMES)){
      const g=GAMES.find(z=>z.id===id);if(!g)continue;
      const s=g.away===slug?d.awayStats:g.home===slug?d.homeStats:null;if(!s)continue;x.g++;
      for(const k of ['plays','totalYds','rushAtt','rushYds','comp','att','passYds','passTD','int','first','thirdMade','thirdAtt','punts','puntYds','fgm','fga'])x[k==='totalYds'?'yds':k]+=(Number(s[k])||0);
    }
  }
  return x;
}
function teamTabHTMLV21(slug,tab){
  const t=TEAM[slug],r=RECORDS[slug],games=teamGamesV21(slug),finals=games.filter(g=>g.status==='final'),upcoming=games.filter(g=>g.status!=='final'),players=teamPlayersV21(slug),agg=teamAggregateV21(slug),stories=typeof v20RecentStories==='function'?v20RecentStories([slug]):[];

function gameStartDateV26(g){
  const m=String(g.time||'').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i); if(!m)return null;
  let hh=Number(m[1]), mm=Number(m[2]); const ap=m[3].toUpperCase(); if(ap==='PM'&&hh!==12)hh+=12;if(ap==='AM'&&hh===12)hh=0;
  return new Date(`${g.date}T${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}:00`);
}
function scoreboardGamesV26(selected){
  const g=GAMES.find(x=>x.id===selected), date=g?.date||'2026-09-06';
  const day=GAMES.filter(x=>x.date===date).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
  const pool=day.length?day:GAMES.slice(-8);
  return pool.slice(0,10);
}

function prestoPeriodV33(p){

function prestoPlayTypeV33(t){

  if(/INTERCEPTION|INT/.test(s)) return 'INTERCEPTION';
  if(/FUMBLE|TURNOVER/.test(s)) return 'TURNOVER';
  if(/SACK/.test(s)) return 'SACK';
  return s;
}
function prestoLatestDownV33(plays){
  for(const p of (plays||[])){
    const d=String(p.description||'');
    const m=d.match(/\b([1-4])(st|nd|rd|th)\s*(?:and|&)\s*([0-9]+|goal)\b/i);
    if(m) return `${m[1]}${m[2].toLowerCase()} & ${m[3]}`;

  }

function applyPrestoSnapshotV33(payload){

  }

<script>
/* V49 — hard isolate live snapshots by matchup to prevent cross-game feed flashes. */
(function(){
  function normId49(v){ return String(v||'').trim().toUpperCase(); }
  function expectedIds49(id){
    const g=(GAMES||[]).find(x=>x.id===id);
    if(!g) return null;
    return {
      away:normId49(TEAM?.[g.away]?.abbr),
      home:normId49(TEAM?.[g.home]?.abbr)
    };
  }
  function payloadMatches49(payload){
    if(!payload?.ok || !payload?.game || !payload?.data) return true;
    const exp=expectedIds49(payload.game);
    if(!exp) return true;
    const gm=payload.data.game||{};
    const a=normId49(gm.awayId), h=normId49(gm.homeId);
    // If the source supplied team ids, they MUST belong to the game being updated.
    if(a && exp.away && a!==exp.away) return false;
    if(h && exp.home && h!==exp.home) return false;
    return true;
  }

  const prevApply49=applyPrestoSnapshotV33;
  applyPrestoSnapshotV33=function(payload){
    if(!payloadMatches49(payload)){
      console.warn('V49 rejected cross-game Presto snapshot', payload?.game, payload?.data?.game);
      return false;
    }
    return prevApply49(payload);
  };

  // Discovered games use their page-specific dynamic poller. Never let the legacy
  // generic Presto loop poll those ids, because its fallback source is McMaster-Guelph.
  function quarantineDiscovered49(){
    try{

      }

  }
  setInterval(quarantineDiscovered49,1000);
  setTimeout(quarantineDiscovered49,50);
})();

    const g=GAMES.find(x=>x.id===id);if(!g)return;
    if(!past58(g)&&g.status!=='final')return showGameBase58(id);
    location.hash='game='+id;
    if(scoreKnown58(g)&&boxUseful58(id))return showGameBase58(id);
    const a=TEAM[g.away],h=TEAM[g.home];
    document.getElementById('app').innerHTML=shell(`<button class="back" onclick="goHome()">← Back to schedule</button><div class="finalLoadV58"><b>Loading official box score…</b><br>Pulling the completed ${esc(a.short)} at ${esc(h.short)} game from PrestoSports.</div>`,'schedule');
    const x=await fetchFinal58(g,true);
    if(x)applyFinal58(g,x);
    if(location.hash!=='#game='+id)return;
    showGameBase58(id);
  };

  async function hydrateCards58(){
    const cards=[...document.querySelectorAll('.gameCard[data-game-id]')];
    const ids=[...new Set(cards.map(c=>c.dataset.gameId).filter(Boolean))];
    await Promise.all(ids.map(async id=>{const g=GAMES.find(x=>x.id===id);if(!g||!past58(g)||scoreKnown58(g))return;const x=await fetchFinal58(g,false);if(x)applyFinal58(g,x);}));
    let changed=false;for(const c of cards){const id=c.dataset.gameId,g=GAMES.find(x=>x.id===id);if(!g||!past58(g)||!scoreKnown58(g))continue;const scores=c.querySelectorAll('.score');if(scores.length>=2){if(scores[0].textContent!==String(g.awayScore)||scores[1].textContent!==String(g.homeScore)){scores[0].textContent=g.awayScore;scores[1].textContent=g.homeScore;changed=true;}}}
  }
  const updateCalBase58=updateCal;
  updateCal=function(){const r=updateCalBase58.apply(this,arguments);setTimeout(hydrateCards58,0);return r};
  const renderHomeBase58=renderHome;
  renderHome=function(){const r=renderHomeBase58.apply(this,arguments);setTimeout(hydrateCards58,0);return r};
  setTimeout(hydrateCards58,100);
})();
</script>
