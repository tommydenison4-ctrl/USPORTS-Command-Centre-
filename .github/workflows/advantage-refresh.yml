name: Refresh Advantage model data
on:
  push:
    paths:
      - '.github/workflows/advantage-refresh.yml'
      - 'scripts/advantage/national.py'
      - 'scripts/advantage/players.py'
      - 'scripts/advantage/ingest.py'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: advantage-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: scripts/advantage/feed-cache
          key: advantage-feeds-${{ github.run_id }}
          restore-keys: advantage-feeds-
      - run: pip install -r scripts/advantage/requirements.txt
      - run: python -m unittest discover -s scripts/advantage -p "test_*.py"
      - run: python scripts/advantage/refresh.py
      - run: node scripts/advantage/check-national.cjs
      - name: Refresh saved standings, rankings, news and podcasts
        continue-on-error: true
        run: node scripts/refresh-feeds.cjs
      - name: Refresh official watch player photos
        continue-on-error: true
        run: python scripts/refresh-watch-media.py
      - name: Save refreshed data
        run: |
          git config user.name 'Advantage data bot'
          git config user.email 'advantage-data@users.noreply.github.com'
          git add data/watch-media.json watch-media-data.js
          git add player-stats-usports-data.js national-schedule-data.js data/national-schedule-usports.json data/verified-results-usports.json data/player-stats-*.json data/season-watch.json season-watch-data.js data/advantage-*.json data/forecasts-*.json data/advantage-snapshots data/pregame-predictions-*.json advantage-data.js data/player-leaders-usports.json player-leaders-data.js data/boxscores data/standings-usports.json standings-data.js rankings-data.js news-data.js podcasts-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Advantage prediction inputs'
            git push
          fi
