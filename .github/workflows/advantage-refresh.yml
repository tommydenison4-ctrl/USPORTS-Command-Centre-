name: Refresh Advantage model data
on:
  workflow_dispatch:
  schedule:
    - cron: '35 10 * * *'
permissions:
  contents: write
concurrency:
  group: advantage-data-refresh
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/cache@v4
        with:
          path: scripts/advantage/feed-cache
          key: advantage-feeds-${{ github.run_id }}
          restore-keys: advantage-feeds-
      - run: pip install -r scripts/advantage/requirements.txt
      - run: python scripts/advantage/refresh.py
      - name: Save refreshed data
        run: |
          git config user.name 'Advantage data bot'
          git config user.email 'advantage-data@users.noreply.github.com'
          git add data/season-watch.json season-watch-data.js data/advantage-*.json data/forecasts-*.json data/advantage-snapshots advantage-data.js data/player-leaders-usports.json player-leaders-data.js
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh verified Advantage prediction inputs'
            git push
          fi
