name: Sync U SPORTS Rosters and Logos
on:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npm run sync:data
      - name: Commit refreshed data
        run: |
          git config user.name "usports-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/rosters assets/teams
          git diff --cached --quiet || git commit -m "Refresh U SPORTS rosters and logos"
          git push
