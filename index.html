<script>
/* V7 live event model. Production collector and demo both call applyRealtimeEvent(). */
const LIVE_STORE = {
  selected:null,
  games:{},
  plays:{},
  demoTimer:null,
  demoIndex:0,
  connected:false
};
function mark(t,cls=''){return `<span class="badgeMark ${cls}" style="background:${t.primary};color:${t.secondary}">${t.abbr}</span>`}
function seedLiveGames(){
  LIVE_STORE.games={};
  LIVE_STORE.plays={};
  LIVE_STORE.selected=null;
  LIVE_STORE.connected=false;
  const scheduled=GAMES.filter(g=>g.date===TODAY && g.status!=='final');
  scheduled.forEach(g=>{
    LIVE_STORE.games[g.id]={
      id:g.id,away:g.away,home:g.home,
      as:0,hs:0,q:'PRE',clock:g.time,
      pos:null,down:'Scheduled',yard:null,first:null,
      event:'UPCOMING',_realLive:false
    };
  });
  if(scheduled.length) LIVE_STORE.selected=scheduled[0].id;
}
function isUpset(g){
  if(!g || g._realLive!==true) return false;
  if(g.event==='UPSET ALERT') return true;
  if(g.rankHome && !g.rankAway && g.as>g.hs && (g.q==='Q4'||g.q==='Q3')) return true;
  if(g.rankAway && !g.rankHome && g.hs>g.as && (g.q==='Q4'||g.q==='Q3')) return true;
  return false;
}
function otherGameCard(g){
  const a=TEAM[g.away],h=TEAM[g.home],up=isUpset(g);
  return `<div class="otherGame ${up?'upset':''}" id="og-${g.id}" onclick="showGameCast('${g.id}')">
    <div class="ogTop"><span>${g.q} • ${g.clock}</span><span>${g.pos===g.away?a.abbr:h.abbr} BALL${up?'<span class="upsetTag">UPSET ALERT</span>':''}</span></div>
    <div class="ogRow">${mark(a,'sm')}<b>${a.short}</b><span class="ogScore">${g.as}</span></div>
    <div class="ogRow">${mark(h,'sm')}<b>${h.short}</b><span class="ogScore">${g.hs}</span></div>
    ${g.event?`<div class="ogEvent">${g.event}</div>`:''}
  </div>`;
}
function renderOtherGames(){
  const el=document.getElementById('otherGames'); if(!el)return;
  el.innerHTML=Object.values(LIVE_STORE.games).filter(g=>g.id!==LIVE_STORE.selected).map(otherGameCard).join('');
}
function selectedGame(){return LIVE_STORE.games[LIVE_STORE.selected]}
function fieldX(yard){return Math.max(8,Math.min(92,8+(yard/100)*84))}
function fieldEventClass(type){
  if(['TOUCHDOWN','INTERCEPTION','FUMBLE','SAFETY','BLOCKED KICK','PICK SIX'].includes(type))return 'score';
  if(['FIRST DOWN','END Q1','END Q2','HALFTIME','END Q3'].includes(type))return 'micro';
  return '';
}
function showRibbon(type,title,sub,color='#fff'){
  const r=document.getElementById('heroRibbon');if(!r)return;
  r.className='heroRibbon '+fieldEventClass(type);
  r.style.setProperty('--eventColor',color);
  r.querySelector('.ribbonType').textContent=type;
  r.querySelector('.ribbonTitle').textContent=title;
  r.querySelector('.ribbonSub').textContent=sub||'';
  requestAnimationFrame(()=>r.classList.add('show'));
  clearTimeout(r._hide);r._hide=setTimeout(()=>r.classList.remove('show'),type==='TOUCHDOWN'?3000:2200);
}
function updateSelectedUI(){
  const g=selectedGame();if(!g)return;
  const a=TEAM[g.away],h=TEAM[g.home],off=TEAM[g.pos];
  const set=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v};
  set('castAwayName',a.short);set('castHomeName',h.short);set('castAwayScore',g.as);set('castHomeScore',g.hs);
  set('castStatus',`${g.q} • ${g.clock}`);set('castDown',`${g.down} • ${off.abbr} BALL`);
  set('fieldHud',`${off.short.toUpperCase()} BALL • ${g.down}`);
  const ball=document.getElementById('fieldBall'),los=document.getElementById('losLine'),first=document.getElementById('firstLine');
  if(ball){ball.style.left=fieldX(g.yard)+'%';los.style.left=fieldX(g.yard)+'%';first.style.left=fieldX(g.first)+'%'}
  const am=document.getElementById('castAwayMark'),hm=document.getElementById('castHomeMark');
  if(am){am.outerHTML=mark(a,'hero').replace('class="badgeMark hero"','class="badgeMark hero" id="castAwayMark"')}
  if(hm){hm.outerHTML=mark(h,'hero').replace('class="badgeMark hero"','class="badgeMark hero" id="castHomeMark"')}
  const p=document.getElementById('playItems');if(p)p.innerHTML=(LIVE_STORE.plays[g.id]||[]).slice(0,12).map(x=>`<div class="playItem"><div class="playClock">${x.q}<br>${x.clock}</div><div class="playText">${x.text}<span class="eventChip">${x.type}</span></div></div>`).join('');
  set('metaYPP','—');set('metaExpl','—');set('metaTO','—');set('metaDrive','—');
  renderOtherGames();
}
function showGameCast(id){
  if(!LIVE_STORE.games[id]){const sg=GAMES.find(x=>x.id===id);if(sg){LIVE_STORE.games[id]={id,away:sg.away,home:sg.home,as:sg.awayScore||0,hs:sg.homeScore||0,q:'PRE',clock:sg.time,pos:sg.away,down:'Kickoff',yard:50,first:60,event:'UPCOMING'}}else return}
  LIVE_STORE.selected=id;history.replaceState(null,'','#live='+id);const g=selectedGame(),a=TEAM[g.away],h=TEAM[g.home];
  const content=`<div class="liveHub"><button class="back" onclick="goHome()">← National schedule</button>
    <div id="liveConnection" class="demoNotice">Live Demo uses the exact same event handler as the production realtime connector. No live Presto endpoint is connected in this local file yet.</div>
    <div class="liveLayout"><main>
      <section class="castPanel">
        <div class="castScore">
          <div class="castTeam"><span class="badgeMark hero" id="castAwayMark" style="background:${a.primary};color:${a.secondary}">${a.abbr}</span><div><b id="castAwayName">${a.short}</b><small>${a.city}</small></div></div>
          <div class="castCenter"><div class="castStatus" id="castStatus">${g.q} • ${g.clock}</div><div class="castBigScore"><span id="castAwayScore">${g.as}</span>–<span id="castHomeScore">${g.hs}</span></div><div class="castDown" id="castDown">${g.down}</div></div>
          <div class="castTeam home"><div><b id="castHomeName">${h.short}</b><small>${h.city}</small></div><span class="badgeMark hero" id="castHomeMark" style="background:${h.primary};color:${h.secondary}">${h.abbr}</span></div>
        </div>
        <div class="fieldStage"><div class="liveField"><div class="fieldNums"><span>10</span><span>20</span><span>30</span><span>40</span><span>50</span><span>40</span><span>30</span><span>20</span><span>10</span></div><div class="fieldHud" id="fieldHud"></div><div class="losLine" id="losLine"></div><div class="firstLine" id="firstLine"></div><div class="fieldBall" id="fieldBall"></div>
          <div class="heroRibbon" id="heroRibbon"><div class="ribbonType"></div><div class="ribbonTitle"></div><div class="ribbonSub"></div></div>
        </div></div>
        <div class="liveMetaStrip"><div class="liveMeta"><strong id="metaYPP">—</strong><small>YPP</small></div><div class="liveMeta"><strong id="metaExpl">—</strong><small>EXPLOSIVES</small></div><div class="liveMeta"><strong id="metaTO">—</strong><small>TURNOVERS</small></div><div class="liveMeta"><strong id="metaDrive">—</strong><small>DRIVE</small></div></div>
        <div class="castToolbar"><button onclick="startLiveDemo()">▶ LIVE DEMO</button><button onclick="stopLiveDemo()">STOP</button><button onclick="demoEvent('FIRST DOWN')">FIRST DOWN</button><button onclick="demoEvent('EXPLOSIVE')">EXPLOSIVE</button><button onclick="demoEvent('TOUCHDOWN')">TOUCHDOWN</button><button onclick="demoEvent('INTERCEPTION')">TURNOVER</button><button onclick="demoEvent('END Q3')">END QTR</button><button onclick="demoEvent('HALFTIME')">HALFTIME</button></div>
      </section>
      <div class="liveFeed"><section class="playLog"><h3>Play-by-Play</h3><div id="playItems"><div class="noLiveData">Waiting for verified play-by-play.</div></div></section><section class="driveLog"><h3>Current Drive</h3><div class="noLiveData">Drive data will appear when the verified live feed begins.</div></section></div>
    </main><aside class="liveSide"><div class="liveSideHead"><h3><span class="pulseDot"></span>Live Around U SPORTS</h3><small style="color:var(--muted)">tap to switch</small></div><div class="otherGames" id="otherGames"></div></aside></div></div>`;
  document.getElementById('app').innerHTML=shell(content,'live');updateSelectedUI();connectProductionRealtime();
}
function applyRealtimeEvent(e){
  const g=LIVE_STORE.games[e.game_id];if(!g)return;
  const oldA=g.as,oldH=g.hs;
  Object.assign(g,e.state||{});
  if(e.play){LIVE_STORE.plays[e.game_id]=[{q:g.q,clock:g.clock,text:e.play.description,type:e.type||'PLAY'},...(LIVE_STORE.plays[e.game_id]||[])].slice(0,50)}
  const card=document.getElementById('og-'+e.game_id);
  if(card){
    if(g.as!==oldA||g.hs!==oldH){card.style.setProperty('--flash',TEAM[e.scoring_team||g.pos].primary);card.classList.add('flashScore');setTimeout(()=>card.classList.remove('flashScore'),1900)}
    if(['INTERCEPTION','FUMBLE','TURNOVER ON DOWNS'].includes(e.type)){card.classList.add('flashTurnover');setTimeout(()=>card.classList.remove('flashTurnover'),1900)}
    if(['END Q1','END Q2','HALFTIME','END Q3'].includes(e.type)){card.classList.add('quarterState');setTimeout(()=>card.classList.remove('quarterState'),2600)}
  }
  if(e.game_id===LIVE_STORE.selected){
    updateSelectedUI();
    const color=TEAM[e.team||g.pos]?.primary||'#fff';
    const title=e.title||e.type||'UPDATE',sub=e.subtitle||e.play?.description||'';
    showRibbon(e.type||'UPDATE',title,sub,color);
  } else renderOtherGames();
}
let DEMO_EVENTS=[];
function demoEvent(type){} function startLiveDemo(){} function stopLiveDemo(){}
function connectProductionRealtime(){
  const banner=document.getElementById('liveConnection');
  // Production hook: set window.USPORTS_LIVE_ENDPOINT to an SSE endpoint when deployed.
  if(location.protocol.startsWith('http')&&window.USPORTS_LIVE_ENDPOINT){
    try{
      const es=new EventSource(window.USPORTS_LIVE_ENDPOINT);
      es.onopen=()=>{LIVE_STORE.connected=true;if(banner){banner.className='demoNotice realtimeOk';banner.textContent='REALTIME CONNECTED • league scoreboard + selected-game play stream'}};
      es.onmessage=msg=>{try{applyRealtimeEvent(JSON.parse(msg.data))}catch(_){}};
      es.onerror=()=>{if(banner){banner.className='demoNotice';banner.textContent='Realtime endpoint disconnected. GameCast remains available; reconnecting…'}};
    }catch(_){}
  }
}
function showLiveHub(){if(!LIVE_STORE.selected)seedLiveGames();showGameCast(LIVE_STORE.selected)}
seedLiveGames();

applyRealtimeEvent = function(e){
  const g = LIVE_STORE.games[e.game_id]; if(!g) return;
  const oldA = g.as, oldH = g.hs;
  Object.assign(g, e.state || {});
  if(e.play){
    LIVE_STORE.plays[e.game_id] = [{
      q: g.q, clock: g.clock, text: e.play.description, type: e.type || 'PLAY'
    }, ...(LIVE_STORE.plays[e.game_id] || [])].slice(0,50);
  }
  const card = document.getElementById('og-' + e.game_id);
  if(card){
    if(g.as !== oldA || g.hs !== oldH){
      const flashTeam = TEAM[e.scoring_team || e.team || g.pos] || TEAM[g.home];
      card.style.setProperty('--flash', flashTeam.primary);
      card.classList.add('flashScore');
      setTimeout(()=>card.classList.remove('flashScore'),1900);
    }
    if(['INTERCEPTION','FUMBLE','TURNOVER ON DOWNS'].includes(e.type)){
      card.classList.add('flashTurnover');
      setTimeout(()=>card.classList.remove('flashTurnover'),1900);
    }
    if(['END Q1','END Q2','HALFTIME','END Q3'].includes(e.type)){
      card.classList.add('quarterState');
      setTimeout(()=>card.classList.remove('quarterState'),2600);
    }
  }
  if(e.game_id === LIVE_STORE.selected){
    updateSelectedUI();
    const teamSlug = e.team || g.pos || g.home;
    showRibbonEvent({
      type: e.type || 'UPDATE',
      title: e.title || e.type || 'UPDATE',
      subtitle: e.subtitle || e.play?.description || '',
      color: (TEAM[teamSlug] || TEAM[g.home]).primary,
      player_name: e.player_name || '',
      player_image: e.player_image || '',
      team_slug: teamSlug,
      team_short: TEAM[teamSlug]?.short || ''
    });
  } else {
    renderOtherGames();
  }
};

<script id="v80-national-gamecenter-script">
(function(){
  const V80={poll:null,last:new Map(),alertTimer:null};
  window.V80_NATIONAL=V80;

  function todayLocal(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
  function ymd(s){return String(s||'').replace(/-/g,'')}
  function norm(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim()}
  function safeTeam(slug){return (window.TEAM&&TEAM[slug])||{short:slug||'Team',name:slug||'Team',abbr:String(slug||'T').slice(0,3).toUpperCase(),primary:'#64748b',secondary:'#fff',logo:''}}
  function teamSlugFromName(name){
    const n=norm(name); if(!n||!window.TEAMS)return null;
    let best=null,bestScore=0;
    for(const t of TEAMS){
      const vals=[t.name,t.short,t.abbr,t.slug].map(norm).filter(Boolean);
      for(const v of vals){
        let score=0;if(n===v)score=100;else if(n.includes(v)||v.includes(n))score=Math.min(n.length,v.length);else{const a=new Set(n.split(' ')),b=v.split(' ');score=b.filter(x=>x.length>2&&a.has(x)).length*4;}
        if(score>bestScore){bestScore=score;best=t.slug;}
      }
    }
    return bestScore>=4?best:null;
  }
  function gameForApi(x){
    const a=teamSlugFromName(x.visitor),h=teamSlugFromName(x.home);
    if(!a||!h)return null;
    return (GAMES||[]).find(g=>g.away===a&&g.home===h&&(!V80.gameDate||g.date===V80.gameDate))||(GAMES||[]).find(g=>g.away===a&&g.home===h)||null;
  }
  function selectedGameId(){try{return LIVE_STORE?.selected||String(location.hash||'').replace(/^#live=/,'')}catch{return String(location.hash||'').replace(/^#live=/,'')}}
  function selectedDef(){const id=selectedGameId();return (GAMES||[]).find(g=>g.id===id)||null}
  function relevantDate(){const g=selectedDef();return g?.date||todayLocal()}
  function liveForGame(g){try{return LIVE_STORE?.games?.[g.id]||null}catch{return null}}
  function statusOf(g){const l=liveForGame(g);if(l?._realLive)return {kind:'live',label:[l.q,l.clock].filter(Boolean).join(' • ')||'LIVE',as:Number(l.as)||0,hs:Number(l.hs)||0};if(g.status==='final')return {kind:'final',label:'FINAL',as:Number(g.awayScore)||0,hs:Number(g.homeScore)||0};return {kind:'pre',label:g.time||'UPCOMING',as:null,hs:null}}
  function miniLogo(t){if(!t)return '';return `<span class="v80MiniLogo">${t.logo?`<img src="${t.logo}" alt="" onerror="this.style.display='none';this.nextElementSibling.style.display='grid'">`:''}<span style="display:${t.logo?'none':'grid'};background:${t.primary};color:${t.secondary}">${t.abbr||String(t.short).slice(0,3).toUpperCase()}</span></span>`}
  function scoreCard(g){const a=safeTeam(g.away),h=safeTeam(g.home),s=statusOf(g),sel=g.id===selectedGameId();return `<button class="v80ScoreCard ${s.kind} ${sel?'selected':''}" onclick="${s.kind==='final'?`showGame('${g.id}')`:`showGameCast('${g.id}')`}"><div class="v80ScoreTop"><span>${g.conference||''}</span><b>${s.label}</b></div><div class="v80ScoreTeam">${miniLogo(a)}<span>${esc(a.short)}</span><strong>${s.as==null?'':s.as}</strong></div><div class="v80ScoreTeam">${miniLogo(h)}<span>${esc(h.short)}</span><strong>${s.hs==null?'':s.hs}</strong></div></button>`}
  function dayGames(){const date=relevantDate();return (GAMES||[]).filter(g=>g.date===date).sort((a,b)=>{const sa=statusOf(a),sb=statusOf(b),rank={live:0,pre:1,final:2};return rank[sa.kind]-rank[sb.kind]||String(a.time).localeCompare(String(b.time))})}
  function renderScoreStrip(){
    const host=document.querySelector('.gc47')||document.querySelector('.pregameHub')||document.querySelector('.liveHub');if(!host)return;
    let strip=document.getElementById('v80NationalScores');if(!strip){strip=document.createElement('section');strip.id='v80NationalScores';strip.className='v80ScoreStrip';host.prepend(strip)}
    const games=dayGames();strip.innerHTML=`<div class="v80ScoreHeader"><div><span class="v80Pulse"></span><b>AROUND U SPORTS</b><small>National scoreboard • click any game to switch</small></div><div class="v80ScoreDate">${new Date(relevantDate()+'T12:00:00').toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})}</div></div><div class="v80ScoreScroller">${games.length?games.map(scoreCard).join(''):'<div class="v80EmptyScores">No other games loaded for this date.</div>'}</div>`;
    renderSideRail();
  }
  function renderSideRail(){
    const rail=document.getElementById('otherGames');if(!rail)return;
    const rows=dayGames().filter(g=>g.id!==selectedGameId());
    rail.innerHTML=rows.length?rows.map(g=>{const a=safeTeam(g.away),h=safeTeam(g.home),s=statusOf(g);return `<div class="v80RailGame ${s.kind}" onclick="${s.kind==='final'?`showGame('${g.id}')`:`showGameCast('${g.id}')`}"><div class="v80RailMeta"><span>${s.label}</span><b>${g.conference||''}</b></div><div class="v80RailTeam">${miniLogo(a)}<span>${esc(a.short)}</span><strong>${s.as==null?'':s.as}</strong></div><div class="v80RailTeam">${miniLogo(h)}<span>${esc(h.short)}</span><strong>${s.hs==null?'':s.hs}</strong></div></div>`}).join(''):'<div class="v80RailEmpty">No other games on this slate.</div>';
  }
  function showNationalAlert(game,title,sub,type='BIG PLAY'){
    if(!game||game.id===selectedGameId())return;
    let el=document.getElementById('v80NationalAlert');if(!el){el=document.createElement('button');el.id='v80NationalAlert';el.className='v80NationalAlert';document.body.appendChild(el)}
    const a=safeTeam(game.away),h=safeTeam(game.home),s=statusOf(game);
    el.onclick=()=>showGameCast(game.id);
    el.innerHTML=`<div class="v80AlertType">${esc(type)} • ELSEWHERE</div><div class="v80AlertTitle">${esc(title)}</div><div class="v80AlertSub">${esc(sub||`${a.short} ${s.as??''} • ${h.short} ${s.hs??''}`)}</div><div class="v80AlertCTA">OPEN GAMECAST →</div>`;
    el.classList.add('show');clearTimeout(V80.alertTimer);V80.alertTimer=setTimeout(()=>el.classList.remove('show'),5000);
  }
  function yardsFrom(text){const m=String(text||'').match(/\b(\d{2,3})\s*(?:yard|yards|yd|yds)\b/i);return m?Number(m[1]):0}
  function importantType(e){const t=String(e?.type||'').toUpperCase(),d=String(e?.play?.description||e?.subtitle||e?.title||'');if(/TOUCHDOWN|PICK SIX/.test(t)||/touchdown|pick[- ]?six/i.test(d))return 'TOUCHDOWN';if(/INTERCEPTION|FUMBLE|TURNOVER/.test(t)||/intercept|fumble|turnover/i.test(d))return 'TURNOVER';if(/BLOCKED/.test(t)||/blocked (?:punt|kick|field goal)/i.test(d))return 'BLOCKED KICK';if(/SAFETY/.test(t)||/\bsafety\b/i.test(d))return 'SAFETY';if(/FIELD GOAL/.test(t)||/field goal/i.test(d))return 'FIELD GOAL';if(yardsFrom(d)>=20)return 'EXPLOSIVE';if(/SACK/.test(t)&&/3rd|4th|third|fourth/i.test(d))return 'IMPACT SACK';return ''}
  function selectedExplosiveRibbon(e){
    if(e?.game_id!==selectedGameId())return;const kind=importantType(e);if(kind!=='EXPLOSIVE'&&kind!=='IMPACT SACK')return;
    const g=(GAMES||[]).find(x=>x.id===e.game_id),ts=e.team||e.scoring_team||liveForGame(g)?.pos,team=safeTeam(ts);
    if(typeof showRibbonEvent==='function')showRibbonEvent({type:kind,title:kind==='EXPLOSIVE'?`${yardsFrom(e.play?.description||e.subtitle||'')}+ YARD PLAY`:'BIG THIRD/FOURTH DOWN SACK',subtitle:e.play?.description||e.subtitle||e.title||'',color:team.primary,player_name:e.player_name||'',player_image:e.player_image||'',team_slug:ts,team_short:team.short});
  }
  function hookRealtime(){
    if(typeof window.applyRealtimeEvent!=='function'||window.applyRealtimeEvent._v80)return;
    const old=window.applyRealtimeEvent;const wrapped=function(e){const before=e?.game_id?liveForGame((GAMES||[]).find(g=>g.id===e.game_id))?.as+':'+liveForGame((GAMES||[]).find(g=>g.id===e.game_id))?.hs:'';const out=old.apply(this,arguments);try{selectedExplosiveRibbon(e);if(e?.game_id&&e.game_id!==selectedGameId()){const g=(GAMES||[]).find(x=>x.id===e.game_id);const kind=importantType(e);if(g&&kind)showNationalAlert(g,e.title||kind,e.play?.description||e.subtitle||'',kind);else if(g){const after=liveForGame(g)?.as+':'+liveForGame(g)?.hs;if(after!==before)showNationalAlert(g,'SCORE CHANGE',`${safeTeam(g.away).short} ${liveForGame(g)?.as??0} – ${liveForGame(g)?.hs??0} ${safeTeam(g.home).short}`,'SCORE');}}renderScoreStrip();}catch{}return out};wrapped._v80=true;window.applyRealtimeEvent=wrapped;
  }
  async function pollNational(){
    const date=relevantDate();V80.gameDate=date;try{const r=await fetch(`/api/live-games?date=${ymd(date)}`,{cache:'no-store'});if(!r.ok)return;const j=await r.json();for(const x of (j.games||[])){const g=gameForApi(x);if(!g)continue;let l=LIVE_STORE?.games?.[g.id];if(!l&&window.LIVE_STORE){LIVE_STORE.games[g.id]={id:g.id,away:g.away,home:g.home,as:x.awayScore||0,hs:x.homeScore||0,q:x.period||'LIVE',clock:x.clock||'',_realLive:true};l=LIVE_STORE.games[g.id]}else if(l){l.as=Number(x.awayScore)||0;l.hs=Number(x.homeScore)||0;l.q=x.period||l.q||'LIVE';l.clock=x.clock||l.clock||'';l._realLive=true;}
      const prev=V80.last.get(g.id),now={as:Number(x.awayScore)||0,hs:Number(x.homeScore)||0,period:x.period||'',clock:x.clock||''};
      if(prev&&g.id!==selectedGameId()&&(now.as!==prev.as||now.hs!==prev.hs)){const scoring=now.as>prev.as?safeTeam(g.away):safeTeam(g.home);const delta=Math.max(now.as-prev.as,now.hs-prev.hs);showNationalAlert(g,delta>=6?`TOUCHDOWN ${scoring.short.toUpperCase()}`:`SCORE ${scoring.short.toUpperCase()}`,`${safeTeam(g.away).short} ${now.as} – ${now.hs} ${safeTeam(g.home).short} • ${now.period} ${now.clock}`,'SCORE');}
      V80.last.set(g.id,now);
    }renderScoreStrip();}catch{}
  }
  function start(){hookRealtime();renderScoreStrip();clearInterval(V80.poll);pollNational();V80.poll=setInterval(pollNational,12000)}
  function stopIfAway(){if(!/^#live=/.test(location.hash)&&!document.querySelector('.pregameHub')&&!document.querySelector('.gc47')){clearInterval(V80.poll);V80.poll=null}}
  function wrapGameCast(){if(typeof window.showGameCast!=='function'||window.showGameCast._v80)return;const old=window.showGameCast;const w=function(id){const out=old.apply(this,arguments);setTimeout(start,100);return out};w._v80=true;window.showGameCast=w}
  wrapGameCast();hookRealtime();
  window.addEventListener('hashchange',()=>setTimeout(()=>{if(/^#live=/.test(location.hash)||document.querySelector('.pregameHub')||document.querySelector('.gc47'))start();else stopIfAway()},80));
  if(/^#live=/.test(location.hash))setTimeout(start,150);
})();

</script>

<script>
/* V46 — persist discovered Presto sources, make rail cards clickable, and keep live games live after navigation. */
(function(){
  const DISCOVERED_V46={byInternal:{},pollers:{},last:[]};
  function normV46(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();}
  function teamMatchesV46(slug,label){
    const t=TEAM?.[slug]; if(!t)return false; const x=normV46(label), vals=[t.short,t.name,t.city,t.abbr,slug].map(normV46).filter(Boolean);
    return vals.some(v=>x===v||x.includes(v)||v.includes(x));
  }
  function internalIdForV46(g){
    const candidates=(GAMES||[]).filter(x=>x.status!=='final');
    let best=null,bestScore=-1;
    for(const x of candidates){let sc=0;if(teamMatchesV46(x.away,g.visitor))sc+=100;if(teamMatchesV46(x.home,g.home))sc+=100;if(teamMatchesV46(x.away,g.home))sc-=40;if(teamMatchesV46(x.home,g.visitor))sc-=40;if(sc>bestScore){bestScore=sc;best=x;}}
    return bestScore>=180?best.id:'';
  }
  function sourceIdsV46(id){const g=GAMES.find(x=>x.id===id);return {awayId:String(TEAM?.[g?.away]?.abbr||'').toUpperCase(),homeId:String(TEAM?.[g?.home]?.abbr||'').toUpperCase()};}
  function armStateV46(id,d){
    const gdef=GAMES.find(x=>x.id===id); if(!gdef)return;
    const st=LIVE_STORE.games[id]||(LIVE_STORE.games[id]={id,away:gdef.away,home:gdef.home,as:0,hs:0,q:'PRE',clock:gdef.time,pos:null,down:'Scheduled',yard:null,first:null,event:'UPCOMING'});
    st._realLive=true;
    if(d){st.q=d.status?.period||st.q;st.clock=d.status?.clock||st.clock;if(d.game?.awayScore!=null)st.as=d.game.awayScore;if(d.game?.homeScore!=null)st.hs=d.game.homeScore;st.pos=d.situation?.possession||d.drives?.[0]?.team||st.pos;st.down=d.situation?.down?`${d.situation.down}${d.situation.down===1?'st':d.situation.down===2?'nd':d.situation.down===3?'rd':'th'} & ${d.situation.distance}`:st.down;}
  }
  async function pollDynamicV46(id){
    const src=DISCOVERED_V46.byInternal[id]; if(!src)return;
    try{
      const ids=sourceIdsV46(id);
      const u=`/api/presto-live?game=${encodeURIComponent(id)}&page=${encodeURIComponent(src.page)}&awayId=${encodeURIComponent(ids.awayId)}&homeId=${encodeURIComponent(ids.homeId)}&_=${Date.now()}`;
      const r=await fetch(u,{cache:'no-store',headers:{Accept:'application/json'}});const j=await r.json();
      if(j?.ok){PRESTO_V33.lastSnapshot=j;PRESTO_V33.lastError='';armStateV46(id,j.data);applyPrestoSnapshotV33(j);if(location.hash===`#live=${id}`){setTimeout(()=>{patchSnapshotV45?.(j.data);},0);}}
      else PRESTO_V33.lastError=j?.error||`live source ${r.status}`;
    }catch(e){PRESTO_V33.lastError=String(e?.message||e);}
  }
  function startDynamicV46(id){
    Object.keys(DISCOVERED_V46.pollers).forEach(k=>{if(k!==id){clearInterval(DISCOVERED_V46.pollers[k]);delete DISCOVERED_V46.pollers[k];}});
    pollDynamicV46(id);if(!DISCOVERED_V46.pollers[id])DISCOVERED_V46.pollers[id]=setInterval(()=>pollDynamicV46(id),10000);
  }
  window.openDiscoveredV46=function(boxId){
    const g=DISCOVERED_V46.last.find(x=>x.boxId===boxId);if(!g)return;
    const id=internalIdForV46(g);if(!id){console.warn('No internal game match for discovered live game',g);return;}
    DISCOVERED_V46.byInternal[id]=g;PRESTO_V33_GAMES.add(id);armStateV46(id,{status:{period:g.period,clock:g.clock},game:{awayScore:g.awayScore,homeScore:g.homeScore}});LIVE_STORE.selected=id;history.replaceState(null,'','#live='+id);showGameCast(id);startDynamicV46(id);
  };
  function renderRailV46(){

<script>
/* V49 — hard isolate live snapshots by matchup to prevent cross-game feed flashes. */
(function(){
  function normId49(v){ return String(v||'').trim().toUpperCase(); }
  function expectedIds49(id){
    const g=(GAMES||[]).find(x=>x.id===id);
    if(!g) return null;
    return {
      away:normId49(TEAM?.[g.away]?.abbr),
      home:normId49(TEAM?.[g.home]?.abbr)
    };
  }
  function payloadMatches49(payload){
    if(!payload?.ok || !payload?.game || !payload?.data) return true;
    const exp=expectedIds49(payload.game);
    if(!exp) return true;
    const gm=payload.data.game||{};
    const a=normId49(gm.awayId), h=normId49(gm.homeId);
    // If the source supplied team ids, they MUST belong to the game being updated.
    if(a && exp.away && a!==exp.away) return false;
    if(h && exp.home && h!==exp.home) return false;
    return true;
  }

  const prevApply49=applyPrestoSnapshotV33;
  applyPrestoSnapshotV33=function(payload){
    if(!payloadMatches49(payload)){
      console.warn('V49 rejected cross-game Presto snapshot', payload?.game, payload?.data?.game);
      return false;
    }
    return prevApply49(payload);
  };

  // Discovered games use their page-specific dynamic poller. Never let the legacy
  // generic Presto loop poll those ids, because its fallback source is McMaster-Guelph.
  function quarantineDiscovered49(){
    try{
      if(typeof DISCOVERED_V46!=='undefined' && DISCOVERED_V46?.byInternal){
        Object.keys(DISCOVERED_V46.byInternal).forEach(id=>PRESTO_V33_GAMES.delete(id));
      }
    }catch(e){}
  }
  setInterval(quarantineDiscovered49,1000);
  setTimeout(quarantineDiscovered49,50);
})();

/* V67: click any statistical table heading to sort */
table[data-v67-sortable="1"] thead th{cursor:pointer;user-select:none;position:relative;padding-right:24px!important;transition:color .15s ease,background .15s ease}
table[data-v67-sortable="1"] thead th:hover{color:#fff;background:rgba(255,255,255,.055)}
table[data-v67-sortable="1"] thead th::after{content:'↕';position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:10px;opacity:.3}
table[data-v67-sortable="1"] thead th[data-sort-dir="desc"]::after{content:'▼';opacity:1}
table[data-v67-sortable="1"] thead th[data-sort-dir="asc"]::after{content:'▲';opacity:1}

<script id="v67-sortable-stats-script">
(function(){
  const TABLE_SELECTOR='table.leaderTable,table.statsTable,table.richTable,table.v65-table';

  function normalizedValue(cell){
    const raw=(cell?.innerText||cell?.textContent||'').replace(/\u00a0/g,' ').trim();
    if(!raw) return {type:'empty',value:''};
    const record=raw.match(/^\s*(\d+)\s*[-–]\s*(\d+)(?:\s*[-–]\s*(\d+))?\s*$/);
    if(record){
      const w=Number(record[1]),l=Number(record[2]),t=Number(record[3]||0),games=w+l+t;
      return {type:'number',value:games ? ((w+.5*t)/games)*1000000 + w*1000 - l : 0};
    }
    const cleaned=raw.replace(/,/g,'').replace(/%/g,'').replace(/^\+/,'');
    if(/^[-+]?\d*\.?\d+$/.test(cleaned)) return {type:'number',value:Number(cleaned)};
    const leading=cleaned.match(/^[-+]?\d+(?:\.\d+)?/);
    if(leading && /(?:yd|yards?|pts?|points?|games?|att|cmp|td|int|avg|ypg|%)/i.test(raw)) return {type:'number',value:Number(leading[0])};
    return {type:'text',value:raw.toLocaleLowerCase()};
  }

  function renumber(table){
    const first=table.tHead?.rows?.[0]?.cells?.[0];
    if(!first || first.textContent.trim()!=='#') return;
    [...(table.tBodies[0]?.rows||[])].forEach((row,i)=>{
      if(row.cells[0]) row.cells[0].textContent=String(i+1);
    });
  }

  function makeSortable(table){
    if(!table || table.dataset.v67Sortable==='1' || !table.tHead || !table.tBodies.length) return;
    table.dataset.v67Sortable='1';
    const headers=[...table.tHead.rows[0].cells];
    headers.forEach((th,index)=>{
      th.title='Click to sort';
      th.setAttribute('role','button');
      th.tabIndex=0;
      const doSort=()=>{
        const body=table.tBodies[0];
        const rows=[...body.rows];
        if(rows.length<2) return;
        const sample=rows.map(r=>normalizedValue(r.cells[index])).find(v=>v.type!=='empty');
        const numeric=sample?.type==='number';
        const previous=th.dataset.sortDir;
        const dir=previous ? (previous==='desc'?'asc':'desc') : (numeric?'desc':'asc');
        headers.forEach(h=>{ if(h!==th) delete h.dataset.sortDir; });
        th.dataset.sortDir=dir;
        rows.sort((ra,rb)=>{
          const a=normalizedValue(ra.cells[index]), b=normalizedValue(rb.cells[index]);
          if(a.type==='empty'&&b.type==='empty') return 0;
          if(a.type==='empty') return 1;
          if(b.type==='empty') return -1;
          let cmp;
          if(a.type==='number'&&b.type==='number') cmp=a.value-b.value;
          else cmp=String(a.value).localeCompare(String(b.value),undefined,{numeric:true,sensitivity:'base'});
          return dir==='asc'?cmp:-cmp;
        });
        rows.forEach(r=>body.appendChild(r));
        renumber(table);
      };
      th.addEventListener('click',doSort);
      th.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();doSort();}});
    });
  }

  function scan(root=document){
    if(root.matches?.(TABLE_SELECTOR)) makeSortable(root);
    root.querySelectorAll?.(TABLE_SELECTOR).forEach(makeSortable);
  }
  scan();
  new MutationObserver(muts=>muts.forEach(m=>m.addedNodes.forEach(n=>{if(n.nodeType===1)scan(n)}))).observe(document.body,{childList:true,subtree:true});
})();
</script>

<script id="v83-podcasts">
/* V83 — At The 55 in-site podcast/video hub. No Supabase required. */
const POD83_FEATURED={
  id:'98rPz2OqKok',
  title:'The 55 Podcast — @atthe55podcast',
  published:'Featured episode',
  channel:'@atthe55podcast',
  description:'The 55 Podcast from the official @atthe55podcast YouTube channel.'
};
let POD83_EPISODES=[POD83_FEATURED];
let POD83_SELECTED=POD83_FEATURED.id;
function pod83Esc(s){return String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]||c))}
function pod83Thumb(id){return `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`}
function pod83Player(id){
 const safe=encodeURIComponent(id);
 const watch=`https://www.youtube.com/watch?v=${safe}`;
 if(location.protocol==='file:'){
  return `<div class="pod83Frame pod85LocalFrame"><img src="${pod83Thumb(id)}" alt="At The 55 episode thumbnail"><div class="pod85LocalShade"><div><span class="pod83Tag">LOCAL PREVIEW</span><h3>Player activates on the deployed site</h3><p>YouTube requires an HTTP referrer for embedded playback. A file:// preview cannot provide one.</p><a class="pod83Btn primary" href="${watch}" target="_blank" rel="noopener">Open episode on YouTube</a></div></div></div>`;
 }
 const origin=encodeURIComponent(location.origin);
 return `<div class="pod83Frame"><iframe src="https://www.youtube.com/embed/${safe}?rel=0&modestbranding=1&playsinline=1&origin=${origin}" title="At The 55 podcast player" loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe></div>`
}
function pod83Card(ep){return `<article class="pod83Card" onclick="pod83Select('${pod83Esc(ep.id)}')"><img class="pod83Thumb" src="${pod83Thumb(ep.id)}" alt=""><div class="pod83Body"><b>${pod83Esc(ep.title||'At The 55')}</b><small>${pod83Esc(ep.published||'')}</small></div></article>`}
function pod83Selected(){return POD83_EPISODES.find(e=>e.id===POD83_SELECTED)||POD83_EPISODES[0]||POD83_FEATURED}

 const ep=pod83Selected();
 const grid=POD83_EPISODES.filter(e=>e.id!==ep.id).slice(0,12);
 const html=`<section class="pod83Hero"><div class="kicker">U SPORTS FOOTBALL MEDIA</div><h1>Podcasts.</h1><p>Play The 55 Podcast directly inside the Game Centre. Episodes are pulled from the official @atthe55podcast YouTube channel.</p></section>

 <section class="pod83Section"><div class="pod83SectionHead"><div><div class="kicker">LATEST EPISODES</div><h2>The 55 Podcast</h2></div><div class="pod83Status" id="pod83Status">Checking channel…</div></div><div id="pod83Grid" class="pod83Grid">${grid.length?grid.map(pod83Card).join(''):'<div class="pod83Loading">Loading recent episodes…</div>'}</div></section>
 <section class="pod83Section"><div class="pod83SectionHead"><div><div class="kicker">SOCIAL</div><h2>Follow the conversation</h2></div></div><div class="pod84Social">
 <a class="pod84SocialCard" href="https://www.instagram.com/the55podcast/?hl=en" target="_blank" rel="noopener"><div class="pod84SocialText"><b>@the55podcast</b><small>The 55 Podcast on Instagram</small></div><span class="pod84SocialArrow">↗</span></a>
 <a class="pod84SocialCard" href="https://www.instagram.com/prsvre_/?hl=en" target="_blank" rel="noopener"><div class="pod84SocialText"><b>@prsvre_</b><small>PRSVRE on Instagram</small></div><span class="pod84SocialArrow">↗</span></a>
 </div></section>`;
 document.getElementById('app').innerHTML=shell(html,'podcasts');
 location.hash='podcasts';
 setTimeout(pod83Load,0);
}
function podcasts83(){pod83Render()}
function pod83Select(id){POD83_SELECTED=id;pod83Render();window.scrollTo({top:0,behavior:'smooth'})}
async function pod83Load(){
 try{
  const r=await fetch('/api/podcasts?channel=@atthe55podcast',{cache:'no-store'}); if(!r.ok) throw new Error('HTTP '+r.status);
  const j=await r.json(); const rows=Array.isArray(j.episodes)?j.episodes:[];
  const m=new Map([[POD83_FEATURED.id,POD83_FEATURED]]); rows.forEach(e=>{if(e?.id&&!m.has(e.id))m.set(e.id,e)});
  POD83_EPISODES=[...m.values()];
  const grid=document.getElementById('pod83Grid'); if(grid) grid.innerHTML=POD83_EPISODES.filter(e=>e.id!==POD83_SELECTED).slice(0,12).map(pod83Card).join('')||'<div class="pod83Loading">Featured episode is ready to play.</div>';
  const st=document.getElementById('pod83Status'); if(st) st.textContent=rows.length?`${rows.length} recent channel videos loaded`:'Featured episode loaded';
 }catch(e){const st=document.getElementById('pod83Status');if(st)st.textContent='Featured episode ready • live channel refresh unavailable';}
}
/* Final shell override adds Podcasts as a first-class nav item while preserving V82 mobile scrolling. */
const shellBefore83=window.shell;

 const html=shellBefore83(content,active);
 return html.replace(`<button class="${active==='media'?'active':''}" onclick="showMedia()">Media</button>`,`<button class="${active==='media'?'active':''}" onclick="showMedia()">Media</button><button class="${active==='podcasts'?'active':''}" onclick="podcasts83()">Podcasts</button>`).replace(/V78 • Official Top 10 \+ Opponent-Adjusted Predictions|V71 • Official Top 10|V32 • verified-data build/g,'V86 • The 55 Podcast Source Fix');
};

<script id="v90-eastern-times">
/* V91 — normalize every displayed scheduled kickoff to Eastern Daylight Time (EDT).
   Source schedule times are venue-local. 2026 regular season ends Oct 31, while Toronto is still on EDT (UTC-4). */
(function(){
  const EASTERN_OFFSETS_V90={
    /* OUA + RSEQ are already Eastern */
    carleton:0,guelph:0,mcmaster:0,ottawa:0,queens:0,toronto:0,waterloo:0,western:0,windsor:0,laurier:0,york:0,
    bishops:0,concordia:0,laval:0,mcgill:0,montreal:0,sherbrooke:0,
    /* AUS schedule is Atlantic Daylight Time: EDT is one hour earlier */
    acadia:-1,'mount-allison':-1,'saint-marys':-1,stfx:-1,
    /* Canada West venue-local conversions to EDT */
    ubc:3,                 // PDT -> EDT
    alberta:2,calgary:2,   // MDT -> EDT
    regina:2,saskatchewan:2, // Saskatchewan CST -> EDT in Sep/Oct
    manitoba:1             // CDT -> EDT
  };
  function parseClockV90(value){
    const m=String(value||'').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i);
    if(!m)return null;
    let h=Number(m[1])%12; if(m[3].toUpperCase()==='PM')h+=12;
    return {h,m:Number(m[2])};
  }
  function fmtClockV90(total){
    total=((total%1440)+1440)%1440;
    const h24=Math.floor(total/60), mm=total%60, ap=h24>=12?'PM':'AM', h=(h24%12)||12;
    return `${h}:${String(mm).padStart(2,'0')} ${ap} EDT`;
  }
  function toEasternV90(g){
    if(!g||g._v90Eastern)return g;
    if(/\b(?:EDT|EST|ET)\b/i.test(g.time||'')){g._v90Eastern=true;return g;}
    const p=parseClockV90(g.time); if(!p)return g;
    const offset=EASTERN_OFFSETS_V90[g.home];
    /* Unknown venues are left unchanged rather than guessed. */
    if(typeof offset!=='number')return g;
    g._localTimeV90=g.time;
    g._venueOffsetToEasternV90=offset;
    g.time=fmtClockV90(p.h*60+p.m+offset*60);
    g._v90Eastern=true;
    return g;
  }
  function convertAllV90(){
    if(typeof GAMES!=='undefined' && Array.isArray(GAMES)) GAMES.forEach(toEasternV90);
  }
  window.toEasternV90=toEasternV90;
  window.convertAllV90=convertAllV90;
  convertAllV90();
  // GAMES is declared with top-level const, so it is a lexical global rather than window.GAMES.

  /* Any games discovered/merged after initial load are normalized before rendering. */
  if(typeof GAMES!=='undefined' && Array.isArray(GAMES)){
    const nativePush=GAMES.push.bind(GAMES);
    GAMES.push=function(...items){ items.forEach(toEasternV90); return nativePush(...items); };
  }

  /* Kickoff handoff must use the Eastern instant, not the browser's own local zone. */
  window.gameStartDateV26=function(g){
    if(!g)return null;
    toEasternV90(g);
    const m=String(g.time||'').match(/(\d{1,2}):(\d{2})\s*(AM|PM)/i); if(!m)return null;
    let hh=Number(m[1])%12; if(m[3].toUpperCase()==='PM')hh+=12;
    return new Date(`${g.date}T${String(hh).padStart(2,'0')}:${m[2]}:00-04:00`);
  };

  /* Repaint whichever first view was rendered before this final normalization layer ran. */
  function repaintV90(){
    convertAllV90();
    const h=location.hash.slice(1);
    try{
      if(h.startsWith('team=')&&typeof showTeam==='function') return showTeam(h.slice(5));
      if(h.startsWith('live=')&&typeof showGameCast==='function') return showGameCast(h.slice(5));
      if(h.startsWith('game=')&&typeof showGame==='function') return showGame(h.slice(5));
      if(h==='podcasts'&&typeof podcasts83==='function') return podcasts83();
      if(h==='command'&&typeof command65==='function') return command65();
      if(h==='rankings'&&typeof rankingsPage65==='function') return rankingsPage65();
      if(h==='playoffs'&&typeof playoffs72==='function') return playoffs72();
      if(h==='matchup'&&typeof matchup72==='function') return matchup72();
      if(h==='leaders'&&typeof showLeaders==='function') return showLeaders();
      if(h==='teamstats'&&typeof showTeamStats==='function') return showTeamStats();
      if(h==='teams'&&typeof showTeams==='function') return showTeams();
      if(h==='conferences'&&typeof showConferences==='function') return showConferences();
      if(typeof renderHome==='function') return renderHome();
    }catch(e){console.warn('V90 EDT repaint',e)}
  }

  /* Keep the visible build label honest. */
  const priorShellV90=window.shell;
  if(typeof priorShellV90==='function'){
    window.shell=function(content,active='schedule'){
      convertAllV90();
      return priorShellV90(content,active).replace(/V89 • Full Navigation \+ Team-Branded News/g,'V111 • Completed Final Hydration');
    };
  }

  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',()=>setTimeout(repaintV90,0),{once:true});
  else setTimeout(repaintV90,0);
})();
</script>

<script id="v105-legacy-live-quarantine">
(()=>{
  // Older pollers may still be alive elsewhere in this single-file app. They can update data,
  // but they are never allowed to repaint the V105 GameCenter or swap in a retired field.
  const guard=(name)=>{try{const old=window[name];if(typeof old!=='function'||old._v105guard)return;const fn=function(){if(document.querySelector('.v102-live'))return;return old.apply(this,arguments)};fn._v105guard=true;window[name]=fn}catch{}};
  ['updateSelectedUI','renderPrestoDetailsV33','patchSnapshotV45','renderGC47','rail47'].forEach(guard);
  // V105 owns the selected game's polling. Stop the obsolete generic Presto interval if it exists.
  try{if(typeof PRESTO_V33!=='undefined'&&PRESTO_V33?.timer){clearInterval(PRESTO_V33.timer);PRESTO_V33.timer=null}}catch{}
})();

<script id="v111-final-score-hydration">
(()=>{
  const n=v=>{if(v==null||v==='')return null;const x=Number(v);return Number.isFinite(x)?x:null};
  const ymd=d=>String(d||'').replaceAll('-','');
  const apply=(g,d)=>{if(!d||!window.USFinalScores?.matches(g,d)||!(d.final===true||d.status==='final'||/final/i.test(String(d.status?.period||''))))return false;const a=n(d.awayScore??d.as??d.away?.score??d.score?.away),hh=n(d.homeScore??d.hs??d.home?.score??d.score?.home);if(a===null||hh===null)return false;g.awayScore=a;g.homeScore=hh;g.status='final';if(d.teamStats||d.quarters||d.leaders){BOX[g.id]={...(BOX[g.id]||{}),...(d.quarters?{quarters:d.quarters}:{}),...(d.teamStats?.length?{teamstats:d.teamStats}:{}),...(d.leaders?{leaders:d.leaders}:{}),source:d.page||BOX[g.id]?.source||'',summary:'Final score and available statistics loaded from the official completed-game source.'}}try{localStorage.setItem(`v111:final:${g.id}`,JSON.stringify({awayScore:a,homeScore:hh,data:d,ts:Date.now()}))}catch{}return true};
  const saved=g=>{for(const k of [`v111:final:${g.id}`,`v110:final:${g.id}`,`v108:snap:${g.id}`,`v106:snap:${g.id}`,`v105:snap:${g.id}`,`v104:snap:${g.id}`,`v103:snap:${g.id}`,`v102:snap:${g.id}`])try{const j=JSON.parse(localStorage.getItem(k)||sessionStorage.getItem(k)||'null');if(j&&(apply(g,j.data||j)))return true}catch{}return false};
  async function hydrateOne(g){
    if(saved(g))return true;
    const away=TEAM[g.away]?.short||TEAM[g.away]?.name||g.away,home=TEAM[g.home]?.short||TEAM[g.home]?.name||g.home,date=ymd(g.date);
    // Completed-game endpoint is authoritative for yesterday/final games. It scans the
    // national/conference Presto pages and returns the final snapshot even though live-games excludes finals.
    try{const r=await fetch(`/api/final-games?date=${date}&away=${encodeURIComponent(away)}&home=${encodeURIComponent(home)}&detail=1&_=${Date.now()}`,{cache:'no-store'}),j=await r.json();const x=j?.games?.[0];if(j?.ok&&x&&apply(g,x))return true}catch{}
    // Last-resort direct source rediscovery. This can recover a final page retained by the live API.
    try{const r=await fetch(`/api/presto-live?game=${encodeURIComponent(g.id)}&discover=1&date=${date}&away=${encodeURIComponent(g.away)}&home=${encodeURIComponent(g.home)}&_=${Date.now()}`,{cache:'no-store'}),j=await r.json();if(j?.ok&&apply(g,j.data||j))return true}catch{}
    return false;
  }
  let busy=false;
  async function hydrate(){if(busy)return;busy=true;try{const blanks=(GAMES||[]).filter(g=>g.status==='final'&&(n(g.awayScore)===null||n(g.homeScore)===null));if(!blanks.length)return;let changed=false;for(const g of blanks)changed=(await hydrateOne(g))||changed;if(changed&&(!location.hash||location.hash==='#'))renderHome()}finally{busy=false}}
  for(const g of (GAMES||[]))saved(g);
  const oldRender=window.renderHome;window.renderHome=function(){const r=oldRender.apply(this,arguments);setTimeout(hydrate,0);return r};
  setTimeout(hydrate,50);setTimeout(hydrate,2500);
})();
</script>

<script id="v91-explore-teams">
(function(){
  let activeConference='All', searchText='';
  window.exploreTeams=function(){
    location.hash='explore';
    const entries=typeof TEAM!=='undefined' ? Object.entries(TEAM) : [];
    const conferences=['All',...new Set(entries.map(([,t])=>t.conference).filter(Boolean))];
    const cards=entries.sort((a,b)=>String(a[1].name||a[1].short||a[0]).localeCompare(String(b[1].name||b[1].short||b[0]))).map(([slug,t])=>{
      const name=t.name||t.school||t.short||slug;
      const haystack=(name+' '+(t.short||'')+' '+(t.conference||'')).toLowerCase();
      if(activeConference!=='All'&&t.conference!==activeConference)return '';
      if(searchText&&!haystack.includes(searchText))return '';
      const logoSrc=t.logo||'';
      return '<button class="exploreTeamCard" data-slug="'+esc(slug)+'" onclick="showTeam(this.dataset.slug)"><img class="exploreTeamLogo" src="'+esc(logoSrc)+'" alt="" loading="lazy"><span><span class="exploreTeamName">'+esc(name)+'</span><span class="exploreTeamMeta">'+esc(t.conference||'U SPORTS')+(t.city?' · '+esc(t.city):'')+'</span></span></button>';
    }).join('');
    const filters=conferences.map(c=>'<button class="exploreFilter '+(c===activeConference?'active':'')+'" data-conf="'+esc(c)+'" onclick="window._exploreConference(this.dataset.conf)">'+esc(c)+'</button>').join('');
    document.getElementById('app').innerHTML=shell('<section class="statsHero"><div class="kicker">EXPLORE U SPORTS FOOTBALL</div><h1>Teams</h1><p>Browse every program, filter by conference, and open a team page for its schedule, results, and snapshot.</p></section><section class="panel"><div class="exploreControls"><input class="exploreSearch" type="search" placeholder="Search teams or conferences" value="'+esc(searchText)+'" oninput="window._exploreSearch(this.value)"></div><div class="exploreControls">'+filters+'</div><div class="exploreTeamsGrid">'+(cards||'<p>No teams match that search.</p>')+'</div></section>','explore');
  };
  window._exploreConference=function(value){activeConference=value;window.exploreTeams()};
  window._exploreSearch=function(value){searchText=String(value||'').trim().toLowerCase();window.exploreTeams();const input=document.querySelector('.exploreSearch');input?.focus();input?.setSelectionRange(searchText.length,searchText.length)};
  window.addEventListener('hashchange',()=>{if(location.hash==='#explore')window.exploreTeams()});
  if(location.hash==='#explore')setTimeout(()=>window.exploreTeams(),0);
})();
</script>
